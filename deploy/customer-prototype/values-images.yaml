# =============================================================================
# ENBUILD hub — PINNED IMAGE TAGS  (REQUIRED: apply with EVERY install)
# =============================================================================
# WHY THIS IS REQUIRED (or a fresh install breaks):
#   The chart defaults every service image tag to ""  →  appVersion (e.g. 1.0.35).
#   But P1 CCM images are published to the registry by GIT SHA (and a CalVer tag
#   `vYYYY.MM.DD-<shortsha>`), NEVER by appVersion. So a fresh `helm install` with
#   the chart defaults tries to pull `enbuild-backend:1.0.35` etc. — which do not
#   exist — and every pod ImagePullBackOffs. Pin this validated, known-good set.
#
#   The BACKEND tag below includes the Headlamp create-wire + release-name
#   portability + public-client-id fixes (ccm-p1; 166166167 is its ancestor).
#   This exact set is running durably on the eks-10 hub (chart
#   0.1.0-p1ccm-trunk.35, helm rev 5) and was validated end-to-end: greenfield
#   create AND brownfield import both browse in Headlamp.
#
# INSTALL (apply alongside your posture file):
#   helm install enbuild-ib enbuild/enbuild -n enbuild \
#     -f deploy/customer-prototype/values-demo.yaml \
#     -f deploy/customer-prototype/values-images.yaml
#
# AIR-GAP (IL5): also override the registry per service (enbuildBk.image.registry,
# etc.) or the global registry, and mirror these tags into your registry first.
# =============================================================================

enbuildBk:
  image:
    tag: "8c57f588e6c12ecfc2868546dba9012f33afcf1e"   # backend — INCLUDES all Headlamp fixes: create-wire + release-portability + public-client-id + OIDC issuer-reachability (tokenless fallback)
enbuildUi:
  image:
    tag: "b357df1101798411b23d8a5716f03849bb450a21"   # frontend / console (nginx fix rides the chart CM, not the image)
enbuildUser:
  image:
    tag: "8d473885fc7945166def7411dd1ba56954eb2404"   # enbuild-user
enbuildConsumer:
  image:
    tag: "396b4cce7a233b82f77bc195bc942a074b8eef8b"   # mq-consumer

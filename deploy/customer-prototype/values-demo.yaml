# =============================================================================
# ENBUILD hub — DEMO / permissive deploy values  (RECOMMENDED QUICK-START)
# =============================================================================
# Posture: Headlamp cluster browsing + the console work OUT OF THE BOX with NO
# per-user authorization — `authMechanism: local`. This is the most bulletproof,
# zero-config-drift way to deploy the prototype in a customer environment: every
# managed cluster (greenfield-created AND brownfield-imported) is browsable in
# Headlamp immediately, with no OIDC cutover to get wrong.
#
# ►► DISCLOSURE (prototype constraint — state this to the customer) ◄◄
#   In this mode the backend does NOT enforce per-user auth: the console's
#   Headlamp K8s proxy serves reads under a single admin fallback identity, so
#   anyone who can load the console can browse cluster resources. This is an
#   INTENTIONAL prototype demo posture. The PRODUCTION-secure path (real Keycloak
#   SSO + Headlamp OIDC + strict per-user tenancy) is already implemented and
#   documented — see values-production.example.yaml + HEADLAMP-AUTH-HARDENING.md
#   §4. Move to it when you want enforced authorization.
#
# Why local mode (not keycloak+OIDC) for the quick-start: Headlamp's OIDC does a
# SERVER-SIDE token exchange from inside the cluster, so it requires Keycloak to
# be reachable from BOTH the browser AND the in-cluster Headlamp pod (a real
# FQDN). Until you have that, local mode is the reliable, no-surprises default.
#
# The console still uses Keycloak for LOGIN (the SPA forces SSO), so you still
# wire the Keycloak URLs below — but Headlamp browsing does not depend on OIDC.
#
# INSTALL (any release name works; enbuild-ib/enbuild used for consistency):
#   kubectl create namespace enbuild
#   charts/enbuild/scripts/create-bootstrap-secrets.sh -n enbuild
#   helm install enbuild-ib enbuild/enbuild -n enbuild -f values-demo.yaml
#
# Replace every "example.mil" with your domain before installing.
# =============================================================================

global:
  domain: "example.mil"            # <-- REPLACE. console FQDN = <enbuildUi.hostname>.<global.domain>
  istio:
    enabled: true                  # set false if you expose the console via your own ingress

mongodb:
  enabled: true                    # bundled datastore (fine for a demo; use external for prod)

# --- Console SPA login (Keycloak is still used to LOG IN to the console) ------
enbuildUi:
  hostname: "enbuild-ib"
  keycloak:
    url: "https://keycloak.example.mil"   # <-- REPLACE. browser Keycloak origin (for console login)
    realm: "enbuild"
    clientId: "enbuild-ui"

keycloak:
  hostname: "https://keycloak.example.mil"  # <-- REPLACE. bundled Keycloak browser URL (== enbuildUi.keycloak.url)
  demoRealm:
    enabled: true
    consoleUrl: "https://enbuild-ib.example.mil"  # <-- REPLACE. covers the console login redirect

# --- Backend: PERMISSIVE (disclosed prototype posture) -----------------------
enbuildBk:
  authMechanism: "local"           # <== PERMISSIVE: no per-user backend authZ. Headlamp browses out of the box.
  consoleAuthStrict: false
  # Headlamp's K8s proxy has no user identity (it does not run OIDC in this mode),
  # so it serves reads under this fallback identity. Making it an admin (below)
  # guarantees EVERY managed cluster is browsable — no per-cluster tenancy 403.
  kubeProxyFallbackActor: "demo-admin@enbuild.local"
  adminEmails: "demo-admin@enbuild.local"   # the fallback identity is treated as a platform admin
  encryptionKey:
    existingSecret: "enbuild-ib-encryption-key"  # created by scripts/create-bootstrap-secrets.sh
  # Signed audit-export bundle (CCM-32 Auditable) — even the quick-start demo signs the
  # export out of the box so the graded "Auditable" capability works live. SIEM_SIGNING_KEY
  # (ECDSA P-256) created by scripts/create-bootstrap-secrets.sh.
  exportSigning:
    existingSecret: "enbuild-ib-export-signing"

  # --- Launch capability (REQUIRED by the platform to create/import clusters) ---
  # A hub can only manage + browse clusters if it can launch/import them. These
  # wire the backend to your GitLab (forks each cluster's deploy repo) and the
  # gRPC edge (where launched spoke agents dial back). The chart's full-platform
  # guard FAILS the install if any is missing — or set `global.evalMode: true`
  # for a browse-only, launch-incapable eval hub (but then there are no spoke
  # clusters to browse in Headlamp).
  installAgent:
    existingSecret: "enbuild-ib-install-agent-creds"  # GITLAB_TOKEN + ENBUILD_REPO1_* (scripts/create-bootstrap-secrets.sh)
    hubUrl: "grpc-edge.example.mil:443"               # <-- REPLACE. host:443 a launched spoke agent dials back to (== grpcVirtualService.host)
  gitlabConnection:
    host: "https://gitlab.com/"                       # <-- your GitLab base URL
    namespaceId: "REPLACE-GITLAB-GROUP-ID"            # <-- REPLACE. GitLab group id where deploy repos are forked
  grpcVirtualService:
    host: "grpc-edge.example.mil"                     # <-- REPLACE. external FQDN (cert SAN) spoke agents dial back to
    gateway: "istio-system/enbuild-grpc-gw"           # <ns>/<istio gateway> that fronts the gRPC edge

# =============================================================================
# HEADLAMP CLUSTER BROWSING — the endpoint answer + disclosure
# =============================================================================
# ►► OUT OF THE BOX there is NO Headlamp endpoint/URL to configure. ◄◄
# In this permissive posture the backend rebuilds the headlamp-kubeconfigs
# ConfigMap with TOKENLESS spoke contexts (the in-cluster SA user), so Headlamp
# browses every managed cluster through the hub proxy with NO OIDC login page and
# NO server-side discovery. "Open in Headlamp" just works. That is exactly why
# there is deliberately NO headlamp.config.oidc block in this file.
#
# WHY tokenless and not OIDC: Headlamp's per-cluster OIDC does a SERVER-SIDE
# discovery/token-exchange FROM THE POD, so it needs the issuer reachable from
# the browser AND the in-cluster Headlamp pod. On the port-forward access model
# (localhost Keycloak) the pod cannot reach it → `dial tcp ...: connection
# refused` at cluster login. Tokenless is the reliable default that works on
# every access model (localhost port-forward OR real FQDN). DISCLOSURE: in this
# mode Headlamp reads are served under an admin fallback, not per-user auth.
#
# ►► THE SECURE PATH IS ALREADY IMPLEMENTED + DOCUMENTED ◄◄
# For real per-user Headlamp authorization, use values-production.example.yaml:
# strict tenancy + headlamp.config.oidc.* pointed at a REAL FQDN Keycloak issuer
# (reachable from browser AND pod). The backend reconciler then automatically
# switches spoke contexts to `user: oidc`. See HEADLAMP-AUTH-HARDENING.md §4.
# A loopback/localhost OIDC issuer is REJECTED at install time by the
# headlamp-oidc guard, so the broken combo can never ship silently.
# =============================================================================

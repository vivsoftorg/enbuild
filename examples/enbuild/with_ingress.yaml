global:
  image:
    registry: registry.gitlab.com
    pullPolicy: IfNotPresent
    registry_credentials: {}
      # username: registry_user_name
      # password: registry_password
  domain: ijuned.com         # Set the proper domain.
  ingress:
    enabled: true
    tls: true
    tls_secret: vivplatform-cert
    classname: nginx
    annotations:
      cert-manager.io/cluster-issuer: "selfsigned"
enbuildUi:
  # Console FQDN = <hostname>.<global.domain> (enbuild.ijuned.com here). The
  # chart fail-closes when the ingress edge is enabled without BOTH set.
  hostname: enbuild
# The backend requires a MongoDB datasource (the chart fail-closes without one).
# Bundled single-node Mongo — dev/eval; for external Mongo see the
# 'Database (MongoDB)' section of values.yaml.
mongodb:
  enabled: true
  mongo_root_username: "enbuild"
  mongo_root_password: "SuperSecret"   # placeholder — change it
  image:
    registry: docker.io
    repository: library/mongo
    tag: "7.0.14"
# SSO: authMechanism=keycloak fail-closes without a token-verification source.
# This topology example uses the dev/test local-account mode; for real Keycloak
# SSO copy the keycloak blocks from charts/enbuild/examples/values-quickstart.yaml.
enbuildBk:
  authMechanism: local

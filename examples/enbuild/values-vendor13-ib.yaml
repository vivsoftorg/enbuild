# =============================================================================
# ENBUILD hub — vendor13-ib (P1 CCM) override   [chart >= 0.1.0, opinionated]
# =============================================================================
# Release: enbuild-ib   Namespace: enbuild
#
# This is the ENTIRE per-environment surface (~50 lines, down from the previous
# 943-line override). Only environment bindings + references to operator-created
# credential Secrets live here — NO secrets in values. Create the required
# Secrets FIRST (see docs/OPERATOR-DEPLOYMENT-GUIDE.md), then:
#
#   helm upgrade --install enbuild-ib ./charts/enbuild \
#     --namespace enbuild \
#     --values examples/enbuild/values-vendor13-ib.yaml \
#     --kube-context vendor13-ib
#
# Reflects the live deployment: app images from the GitLab staging registry
# (ahead of Iron Bank rebuilds), external HA Mongo, console exposed via an
# externally-managed Istio VirtualService (so istio/ingress are off here).
# =============================================================================

global:
  domain: ijuned.com                 # not used for routing here (console VS is external); kept = live
  storageClass: gp2
  # vendor13-ib's private-registry admission webhook rewrites every pod's
  # imagePullSecrets to "private-registry" (one Secret per namespace). Reference
  # it directly so no registry credentials live in Helm values.
  imagePullSecretName: private-registry
  image:
    registry: registry1.dso.mil      # default; per-service overrides below point at GitLab staging
    pullPolicy: Always
  istio:
    enabled: false                   # console exposed via an externally-managed VirtualService
  ingress:
    enabled: false

lightning_features:
  operations_lightning:
    headlamp: true

# --- App images ---------------------------------------------------------------
# Currently pulled from the GitLab staging registry (ahead of the Iron Bank
# rebuild cycle). Update the tags to the build under test at deploy time.
# Iron Bank end-state: drop the per-service `registry:` overrides (uses the
# global registry1.dso.mil) and switch repos to ironbank/vivsoft/enbuild/* via
# the chart's internal image.repository.
enbuildBk:
  image:
    registry: registry.gitlab.com
    tag: c68767576146c0a011950ffaca2851c7031e0fdc
  # --- operator credential Secret references (create these first) ---
  encryptionKey:
    existingSecret: enbuild-encryption-key      # key: ENCRYPTION_KEY
  messaging:
    existingSecret: enbuild-rabbitmq            # key: RABBIT_MQ_CONNECTION_STRING
  # --- SSO (Keycloak) — authMechanism defaults to "keycloak"; the chart fails the
  #     render if no realm key is supplied, so a misconfigured install can't boot
  #     unverified. Non-secret config below; the SECRET keys ride the existingSecret. ---
  adminEmails: "admin@p1.mil"                   # break-glass; durable admin = /enbuild/platform-admins group
  keycloak:
    realm: "enbuild"
    # browser-facing Keycloak base URL (KEYCLOAK_URL). KEYCLOAK_ISSUER defaults
    # to <url>/realms/<realm>; set `issuer` explicitly only if the gateway host
    # differs from this url (it does once Keycloak is exposed on its own
    # keycloak-* host at the cutover — then issuer = https://keycloak-ib-vendor13.staging.dso.mil/realms/enbuild).
    url: "https://enbuild-ib-vendor13.staging.dso.mil"
    # issuer: "https://keycloak-ib-vendor13.staging.dso.mil/realms/enbuild"  # browser issuer; MUST match SPA + Headlamp issuerURL
    # IN-CLUSTER Keycloak base the backend uses for JWKS + OIDC discovery
    # (KEYCLOAK_BACKEND_URL). DIFFERENT from the browser url above by design —
    # the issuer-alignment invariant: verify keys fetched here, iss pinned to the
    # browser issuer.
    backendUrl: "http://enbuild-ib-keycloak:8080"
    adminBaseUrl: "http://enbuild-ib-keycloak:8080"
    clientId: "enbuild"
    # Operator Secret carrying KEYCLOAK_REALM_PUBLIC_KEY + KEYCLOAK_CLIENT_SECRET +
    # KEYCLOAK_ADMIN_CLIENT_SECRET. (The realm public key is public but coupled to the
    # realm signing key — keep it with the client secret in one operator-managed Secret.)
    existingSecret: enbuild-ib-keycloak-auth
  installAgent:
    existingSecret: enbuild-install-agent-creds # keys: GITLAB_TOKEN, ENBUILD_REPO1_USER/TOKEN
    hubUrl: "enbuild-ib-vendor13.staging.dso.mil:443"
  # --- hub gRPC AgentGateway (how spoke agents reach this hub) ---
  grpcVirtualService:
    host: enbuild-ib-vendor13.staging.dso.mil
    additionalHosts:
      - enbuild-ib.staging.dso.mil
      - enbuild-ib.vendor13.staging.dso.mil
    gateway: istio-gateway/public-ingressgateway
  # Header-less Headlamp/kube-proxy fallback identity (least-privilege, NON-admin).
  # Was "devops@platform.one.mil"; switched to the dedicated least-privilege
  # service identity that matches the backend default. It is NOT in adminEmails,
  # so TenancyGuard authorizes it only for unscoped-read or where it holds viewer
  # membership — grant headlamp-proxy@platform.one.mil VIEWER membership on the
  # projects whose clusters are browsed via Headlamp before/at the next roll,
  # else header-less proxy calls to project-scoped clusters return 403.
  kubeProxyFallbackActor: "headlamp-proxy@platform.one.mil"
  # clusterRpcTimeoutMs not set → uses the chart default "10000" (2026-06-11
  # latency P0 fail-fast). Override here only to change it for this environment.
  # --- Observability & SIEM (SOO §1.5) — see docs/OPERATOR-DEPLOYMENT-GUIDE.md §3b.
  # Spoke perf/security metrics need NO config (the agent auto-routes the spoke's
  # Prometheus). Uncomment to wire SIEM forwarding + in-console log tailing:
  # observability:
  #   existingSecret: enbuild-ib-observability   # keys: SIEM_AUTH_HEADER / LOKI_TOKEN / PROMETHEUS_TOKEN (subset)
  #   siem:
  #     forwardingEnabled: "true"
  #     endpoint: "https://<p1-siem-collector>/services/collector/raw"
  #     format: "json"
  #   loki:
  #     host: "http://logging-loki-gateway.logging.svc.cluster.local"
  #     tenant: "enbuild"
  #   grafana:
  #     base: "https://<grafana-host>"
  #     lokiDatasource: "loki"

enbuildUi:
  hostname: enbuild
  image:
    registry: registry.gitlab.com
    tag: c68767576146c0a011950ffaca2851c7031e0fdc
  # P1 CCM Console runtime config (WORKSTREAM D1 / ADR-0046 CA-4). Emitted as
  # /p1-ccm-console/config.json and consumed by the SPA at boot (window.__P1CCM_CONFIG).
  # This is the BROWSER OIDC config — `url` is the gateway-exposed Keycloak the
  # user's browser reaches; the backend independently fetches JWKS in-cluster
  # (enbuildBk.keycloak.backendUrl) while pinning this same browser issuer.
  # Enable at the CONSOLE_AUTH_STRICT cutover (together with backend
  # consoleAuthStrict=true + headlamp OIDC below). Until then leave url empty so
  # the SPA stays on the non-strict fallback path.
  keycloak:
    url: ""                                       # e.g. https://keycloak-ib-vendor13.staging.dso.mil  (set at cutover)
    realm: "enbuild"                              # matches enbuildBk.keycloak.realm
    clientId: "enbuild-ui"                        # shared public PKCE client (SPA + Headlamp)
  # apiBase omitted → chart default "/enbuild-bk/api/v1"

enbuildUser:
  image:
    registry: registry.gitlab.com
    tag: 8d473885fc7945166def7411dd1ba56954eb2404

enbuildConsumer:
  image:
    registry: registry.gitlab.com
    tag: 2176a559c5979c7feccf0a2054bb25a5da481efa

mongodb:
  enabled: false
  existingSecret: enbuild-mongo                 # keys: MONGO_INITDB_ROOT_USERNAME/PASSWORD/DATABASE, MONGO_SERVER
  # External HA Mongo (the separate enbuild-ib-mongodb StatefulSet). The
  # password is referenced via the env placeholder so no secret appears here.
  mongo_endpoint_override: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@enbuild-ib-mongodb-0.enbuild-ib-mongo-headless.enbuild.svc.cluster.local:27017,enbuild-ib-mongodb-1.enbuild-ib-mongo-headless.enbuild.svc.cluster.local:27017,enbuild-ib-mongodb-2.enbuild-ib-mongo-headless.enbuild.svc.cluster.local:27017/?replicaSet=rs0&w=majority&readPreference=primaryPreferred&authSource=admin"

rabbitmq:
  enabled: true
  auth:
    username: admin                             # matches the existing broker PVC — do NOT change in place
    existingPasswordSecret: enbuild-rabbitmq    # key: rabbitmq-password
    existingErlangSecret: enbuild-rabbitmq      # key: rabbitmq-erlang-cookie
  # image.* (registry1.dso.mil/ironbank/bitnami/rabbitmq:3.12.14) from chart defaults.

headlamp:
  image:
    registry: registry1.dso.mil
    repository: ironbank/opensource/headlamp-k8s/headlamp
    tag: v0.36.0
  imagePullSecrets:
    - name: private-registry
  # Spoke clusters surfaced in the Headlamp picker (routed via BE K8sApiProxy).
  spokes:
    - ccm-vendor13-eks-final
  # ADR-0046 CA-4 / WORKSTREAM D3 — Headlamp OIDC. ENABLE AS PART OF THE
  # CONSOLE_AUTH_STRICT CUTOVER (not before — until strict is on the non-admin
  # fallback still works and forcing OIDC login early would break the demo).
  # When the cutover lands, do ALL of these in one roll:
  #   1. set enbuildBk.consoleAuthStrict: true
  #   2. set enbuildUi.keycloak.url to the gateway-exposed Keycloak (above)
  #   3. uncomment the block below (all four fields together — partial = broken)
  #   4. register the callbackURL as a redirect URI on the realm's enbuild-ui client
  # issuerURL MUST equal the backend KEYCLOAK_ISSUER EXACTLY (the browser issuer
  # the SPA also uses). The backend independently fetches JWKS from the in-cluster
  # enbuildBk.keycloak.backendUrl — these two are SUPPOSED to differ.
  # config:
  #   oidc:
  #     clientID: enbuild-ui                                  # shared public PKCE client (== SPA, == backend KEYCLOAK_CLIENT_ID)
  #     issuerURL: "https://keycloak-ib-vendor13.staging.dso.mil/realms/enbuild"  # == backend KEYCLOAK_ISSUER (browser FQDN)
  #     scopes: "openid email groups"                         # `groups` is REQUIRED for tenancy
  #     callbackURL: "https://<console-host>/headlamp/oidc-callback"

# Self-hosted SSO. The realm + bootstrap-admin password come from the
# operator-created Secret enbuild-ib-keycloak-secrets (the default name for this
# release; keys realm-enbuild.json + KC_BOOTSTRAP_ADMIN_PASSWORD) — never in git.
keycloak:
  enabled: true

# Hub/spoke mTLS — recreate the enbuild-hub-issuer CA ClusterIssuer pointing at
# the existing CA secret (restores cert renewal; does NOT rotate the CA).
pki:
  recreateHubIssuer: true

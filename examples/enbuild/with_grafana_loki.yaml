global:
  monitoring:
    enabled: true
  # This profile demonstrates the monitoring stack only — the console edge stays
  # off (reach it via port-forward). The chart fail-closes when an edge is
  # enabled without global.domain + enbuildUi.hostname.
  istio:
    enabled: false
# The backend requires a MongoDB datasource (the chart fail-closes without one).
# Bundled single-node Mongo — dev/eval; for external Mongo see the
# 'Database (MongoDB)' section of values.yaml.
mongodb:
  enabled: true
  mongo_root_username: "enbuild"
  mongo_root_password: "SuperSecret"   # placeholder — change it
  image:
    registry: docker.io
    repository: library/mongo
    tag: "7.0.14"
# SSO: authMechanism=keycloak fail-closes without a token-verification source.
# This quick profile uses the dev/test local-account mode; for real Keycloak SSO
# copy the keycloak blocks from charts/enbuild/examples/values-quickstart.yaml.
enbuildBk:
  authMechanism: local

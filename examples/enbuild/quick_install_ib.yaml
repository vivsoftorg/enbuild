global:
  AppVersion: 1.0.30
  # Set this explicitly when the cluster does not define a default StorageClass.
  # The GovCloud EKS validation used gp2.
  storageClass: gp2
  image:
    registry: registry1.dso.mil
    pullPolicy: Always
    registry_credentials:
      username: REGISTRY1_USER_NAME
      password: REGISTRY1_PASSWORD
  # This quick profile reaches the console via port-forward/Service, so the
  # Istio edge (chart default ON) is switched off — the chart fail-closes when an
  # edge is enabled without global.domain + enbuildUi.hostname.
  istio:
    enabled: false

mongodb:
  enabled: true
  mongo_root_username: "enbuild"
  mongo_root_password: "SuperSecret"
  image:
    repository: ironbank/opensource/mongodb/mongodb
    tag: 4.4.5

rabbitmq:
  image:
    registry: registry1.dso.mil
    repository: ironbank/bitnami/rabbitmq
    tag: 3.12.14
    pullSecrets:
      - enbuild-ib-image-pull-secret

enbuildUi:
  image:
    repository: ironbank/vivsoft/enbuild/frontend
    tag: 1.0.30-5101868

enbuildBk:
  # SSO: authMechanism=keycloak fail-closes without a token-verification source.
  # This quick profile uses the dev/test local-account mode; for real Keycloak SSO
  # copy the keycloak blocks from charts/enbuild/examples/values-quickstart.yaml.
  authMechanism: local
  image:
    repository: ironbank/vivsoft/enbuild/backend
    tag: 1.0.30-5101272

enbuildUser:
  image:
    repository: ironbank/vivsoft/enbuild/enbuild-user
    tag: 1.0.30-5098733

enbuildConsumer:
  image:
    repository: ironbank/vivsoft/enbuild/enbuild-mq
    tag: 1.0.30-5101532
  # The Iron Bank MQ image works when npm resolves node from /usr/bin first.
  command:
    - /bin/sh
    - -lc
  args:
    - export PATH=/usr/bin:/usr/sbin:/bin:/sbin:/usr/local/bin && exec /usr/bin/npm run run:mq:all

global:
  image:
    pullPolicy: IfNotPresent
  # This quick profile reaches the console via `kubectl port-forward`, so the
  # Istio edge (chart default ON) is switched off — the chart fail-closes when an
  # edge is enabled without global.domain + enbuildUi.hostname.
  istio:
    enabled: false
# The backend requires a MongoDB datasource (the chart fail-closes without one).
# Bundled single-node Mongo — dev/eval; for external Mongo see the
# 'Database (MongoDB)' section of values.yaml. Public docker.io image so the
# profile installs without registry credentials (the CI kind smoke uses it).
mongodb:
  enabled: true
  mongo_root_username: "enbuild"
  mongo_root_password: "SuperSecret"   # placeholder — change it
  image:
    registry: docker.io
    repository: library/mongo
    tag: "7.0.14"
# SSO: authMechanism=keycloak fail-closes without a token-verification source.
# This quick profile uses the dev/test local-account mode; for real Keycloak SSO
# copy the keycloak blocks from charts/enbuild/examples/values-quickstart.yaml.
enbuildBk:
  authMechanism: local

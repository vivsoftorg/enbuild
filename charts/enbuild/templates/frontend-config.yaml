apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-config
  labels:
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
data:
  {{- /*
    P1 CCM Console — runtime config.json (WORKSTREAM D1 / ADR-0046 CA-4).
    Served by the enbuild-ui nginx at /p1-ccm-console/config.json (it falls
    under the existing `location /p1-ccm-console/` static block; `try_files
    $uri ...` resolves this file on disk before the SPA index.html fallback,
    so NO nginx location change is needed). The SPA fetches it at boot and
    stashes the parsed object on `window.__P1CCM_CONFIG`.

    These four keys are the SHARED CONTRACT all three repos agree on:
      keycloakUrl      — browser-facing Keycloak base URL (SPA builds the
                         OIDC authority <url>/realms/<realm>)
      keycloakRealm    — realm name (matches backend KEYCLOAK_REALM)
      keycloakClientId — public PKCE client the SPA + Headlamp share
                         (matches backend KEYCLOAK_CLIENT_ID = enbuild-ui)
      apiBase          — base path the SPA prefixes onto hub API calls

    Sourced from enbuildUi.keycloak.{url,realm,clientId} + enbuildUi.apiBase.
    Keycloak realm defaults to the backend's realm (enbuildBk.keycloak.realm)
    so a single override keeps SPA + backend on the same realm.
  */}}
  {{- $uiKc := default (dict) .Values.enbuildUi.keycloak }}
  {{- $bkKc := default (dict) .Values.enbuildBk.keycloak }}
  {{- $kcRealm := default (default "enbuild" $bkKc.realm) $uiKc.realm }}
  {{- $kcClientId := default "enbuild-ui" $uiKc.clientId }}
  {{- $apiBase := default "/enbuild-bk/api/v1" .Values.enbuildUi.apiBase }}
  {{- /* Impact-level enclave this hub represents (e.g. "IL5"); the SPA header
         self-identifies its enclave. Empty → null → no badge. A legibility tag,
         NOT the isolation boundary (hub-per-IL is — ADR-0044). */}}
  {{- $impactLevel := default "" .Values.enbuildUi.impactLevel }}
  config.json: |
    {
      "keycloakUrl": "{{ $uiKc.url | default $.Values.keycloak.hostname | default "http://localhost:8088" }}",
      "keycloakRealm": "{{ $kcRealm }}",
      "keycloakClientId": "{{ $kcClientId }}",
      "apiBase": "{{ $apiBase }}",
      "impactLevel": {{ if $impactLevel }}"{{ $impactLevel }}"{{ else }}null{{ end }}
    }
  config.js: |
    window.ENV_VAR = {
    {{- if .Values.lightning_features.operations_lightning.headlamp }}
      REACT_APP_HEADLAMP_URL: "/headlamp/",
    {{- end }}
      REACT_APP_API_DOMAIN_PRODUCTION: "/enbuild-bk",
      REACT_APP_API_REQUEST_DOMAIN_PRODUCTION: "/enbuild-request",
      REACT_APP_API_USER_DOMAIN_PRODUCTION: "/enbuild-user",
      REACT_APP_SERVICE_MESH_KIALI_IFRAME_URL: "{{ .Values.enbuildUi.kiali_url }}",
      REACT_APP_MONITORING_GRAFANA_IFRAME_URL: "{{ .Values.enbuildUi.grafana_url }}",
      REACT_APP_COST_UTILIZATION_KUBECOST_IFRAME_URL: "{{ .Values.enbuildUi.kubecost_url }}",
      REACT_APP_LOGS_GRAFANA_IFRAME_URL: "{{ .Values.enbuildUi.loki_url }}",
    };
  featureFlags.json: |
    {{- /*
      Opinionated hub: develop_lightning (Bolt/JupyterHub), secure_lightning
      (CTF) and ai_lightning are PERMANENTLY false — those apps were removed
      from the chart in 0.1.0 (they were OFF in every environment). The flag
      structure is preserved so the frontend keeps hiding their nav tiles. The
      only operator-toggleable flag is operations_lightning.headlamp.
    */ -}}
    {{- $flags := dict
      "develop_lightning" (dict
        "application" false
        "models" false
      )
      "secure_lightning" (dict
        "ctf_lightning" false
      )
      "deploy_lightning" (dict
        "infra_lightning" (dict
          "delete_stack" true
          "clone_stack" true
          "request" true
        )
        "ai_lightning" (dict
          "deploy_models" false
          "fabric" false
          "link" false
        )
        "data_lightning" false
      )
      "operations_lightning" (dict
        "operations" true
        "headlamp" (.Values.lightning_features.operations_lightning.headlamp | default false)
        "metrics" true
      )
    }}
    {{ $flags | toJson }}

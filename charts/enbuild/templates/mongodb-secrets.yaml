{{- /*
  MongoDB credentials. In every real deployment these are provided via an
  operator-managed Secret (mongodb.existingSecret) carrying
  MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD /
  MONGO_INITDB_DATABASE / MONGO_SERVER — see docs/OPERATOR-DEPLOYMENT-GUIDE.md.
  When mongodb.existingSecret is set, this chart Secret is NOT rendered and the
  deployments envFrom the operator Secret instead (see enbuild-bk/mq/user). The
  inline path below is for local dev/test only (bundled single-node Mongo) and
  ships with empty credential defaults — NEVER commit real credentials here.
*/}}
{{- if not .Values.mongodb.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongo-secrets
  labels:
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "{{ .Values.mongodb.mongo_root_username }}"
  MONGO_INITDB_ROOT_PASSWORD: "{{ .Values.mongodb.mongo_root_password }}"
  MONGO_INITDB_DATABASE: enbuild
  {{- if .Values.mongodb.enabled }}
  MONGO_SERVER: "{{ .Release.Name }}-mongo.{{ .Release.Namespace }}.svc.cluster.local:27017"
  {{- else }}
  MONGO_SERVER: "{{ .Values.mongodb.mongo_server }}"
  {{- end }}
{{- end }}


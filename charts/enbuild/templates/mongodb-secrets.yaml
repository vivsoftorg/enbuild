{{- $mongoReplicas := int (.Values.mongodb.replicaCount | default 1) -}}
{{- $rsName := .Values.mongodb.replicaSetName | default "rs0" -}}
{{- $headlessSvc := printf "%s-mongo-headless" .Release.Name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mongo-secrets
  labels:
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "{{.Values.mongodb.mongo_root_username}}"
  MONGO_INITDB_ROOT_PASSWORD: "{{.Values.mongodb.mongo_root_password}}"
  MONGO_INITDB_DATABASE: enbuild
  {{- if .Values.mongodb.enabled }}
  {{- if gt $mongoReplicas 1 }}
  {{- /* Replica-set URI: list every pod's stable DNS name + replicaSet param.
         Mongoose / mongo driver uses this to discover the primary and route
         writes there; secondaries get reads if readPreference != primary.
         w=majority on the application side preserves RPO=0 for committed
         writes across single-AZ loss. */ -}}
  {{- $hosts := list -}}
  {{- range $i, $_ := until $mongoReplicas -}}
  {{- $hosts = append $hosts (printf "%s-mongodb-%d.%s.%s.svc.cluster.local:27017" $.Release.Name $i $headlessSvc $.Release.Namespace) -}}
  {{- end }}
  MONGO_SERVER: "{{ join "," $hosts }}/?replicaSet={{ $rsName }}&w=majority&readPreference=primaryPreferred"
  {{- else }}
  MONGO_SERVER: "{{ .Release.Name }}-mongo.{{ .Release.Namespace }}.svc.cluster.local:27017"
  {{- end }}
  {{- else }}
  MONGO_SERVER: "{{ .Values.mongodb.mongo_server }}"
  {{- end }}

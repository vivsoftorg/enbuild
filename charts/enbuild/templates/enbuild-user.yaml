apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-enbuild-user
  labels:
    app: user
    app.kubernetes.io/component: user
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.enbuildUser.replicas }}
  selector:
    matchLabels:
      app: user
    {{- include "enbuild-helm-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: user    
        app.kubernetes.io/component: user
      {{- include "enbuild-helm-chart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - env:
        - name: MONGODB_ENDPOINT
          {{- /* see enbuild-bk.yaml for rationale on mongo_endpoint_override */}}
          {{- with .Values.mongodb.mongo_endpoint_override }}
          value: {{ . | quote }}
          {{- else }}
          value: mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@$(MONGO_SERVER)
          {{- end }}
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-mongo-secrets
        - secretRef:
            name: {{ .Release.Name }}-backend-secret
        # Image registry: per-service `enbuildUser.image.registry` override
        # wins over the chart-wide `global.image.registry`. Unset by default →
        # falls back to global. See enbuild-mq.yaml for the use-case writeup.
        image: {{ default .Values.global.image.registry .Values.enbuildUser.image.registry }}/{{ .Values.enbuildUser.image.repository }}:{{ default .Chart.AppVersion (default .Values.global.AppVersion .Values.enbuildUser.image.tag) }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 8083
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: enbuild-user
        ports:
        - containerPort: 8083
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 8083
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
{{- if .Values.global.image.registry_credentials }}
      imagePullSecrets:
        - name: {{ .Release.Name }}-image-pull-secret
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-enbuild-user
  labels:
    app: user
    app.kubernetes.io/component: user
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.enbuildUser.service_type }}
  selector:
    app: user
    app.kubernetes.io/component: user
  {{- include "enbuild-helm-chart.selectorLabels" . | nindent 4 }}
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8083
{{- /*
  GAP-07 alerting push-half — Prometheus Operator PrometheusRule binding the
  hub's /api/metrics series to alert expressions (severity: page | ticket).
  Pair with observability.serviceMonitor.enabled=true (the scrape) and route
  the severity labels in YOUR Alertmanager — see the commented receiver/route
  example next to these values in values.yaml.

    - EnbuildHubHighErrorRate (page) — sustained RPC error rate > 10%
    - EnbuildHubAgentDisconnectCascade (page) — 50% of agents dropped in 1h
    - EnbuildHubLatencySLOBreach (ticket) — p95 RPC latency > 2s
    - EnbuildHubAuditEventRateDrop (ticket) — audit emit < 0.1/sec for 15m
    - EnbuildHubProtoTranslationErrors (page) — wire-format regression class

  Thresholds are conservative single-replica defaults — tune per environment.
  Renders ONLY when enbuildBk.observability.prometheusRule.enabled=true
  (requires the monitoring.coreos.com CRDs). Default OFF.
*/}}
{{- $obs := default (dict) .Values.enbuildBk.observability }}
{{- $pr := default (dict) $obs.prometheusRule }}
{{- if $pr.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "enbuild-helm-chart.fullname" . }}-hub-alerts
  labels:
    app.kubernetes.io/component: bk-metrics-rules
    {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: enbuild-hub-grpc
      interval: 30s
      rules:
        # PAGE — sustained error rate > 10% across all RPC types for 10 min.
        # Catches: tenancy-guard cache poisoning, agent-side panics, proto
        # regressions that dispatch but decode every response as error.
        - alert: EnbuildHubHighErrorRate
          expr: |
            sum(rate(enbuild_rpc_dispatch_total{decision!="allow"}[5m]))
              /
            sum(rate(enbuild_rpc_dispatch_total[5m]))
              > 0.10
          for: 10m
          labels:
            severity: page
            context: ClusterRpcService
            rtm: CCM-12
          annotations:
            summary: "ENBUILD hub RPC error rate > 10% for 10m"
            description: "{{`{{ $value | humanizePercentage }}`}} of hub->agent RPCs failing. Pivot: SIEM tail context=ClusterRpcService for the last 10m and correlate by correlationId."
        # PAGE — 50% of agents dropped in 1 hour. Catches: hub OOM,
        # network partition, mass cert-expiry on the spoke side.
        - alert: EnbuildHubAgentDisconnectCascade
          expr: |
            enbuild_agent_connections_active
              <
            (max_over_time(enbuild_agent_connections_active[1h]) * 0.5)
          for: 5m
          labels:
            severity: page
            context: AgentRegistryService
            rtm: CCM-12
          annotations:
            summary: "ENBUILD hub agent connections dropped > 50% in 1h"
            description: "{{`{{ $value }}`}} agents currently connected; cascade failure suspected (hub OOM / network partition / mass cert expiry)."
        # TICKET — p95 latency > 2s sustained 5 min. Catches: spoke K8s API
        # throttling, cert-manager slow renewals, performance regression.
        - alert: EnbuildHubLatencySLOBreach
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, action) (rate(enbuild_rpc_dispatch_duration_seconds_bucket[5m]))
            ) > 2.0
          for: 5m
          labels:
            severity: ticket
            context: ClusterRpcService
            rtm: CCM-15
          annotations:
            summary: "ENBUILD hub p95 RPC latency > 2s (action={{`{{ $labels.action }}`}})"
            description: "Action {{`{{ $labels.action }}`}} p95 latency = {{`{{ $value }}`}}s. Check spoke K8s API health + Prometheus query latency on the agent."
        # TICKET — audit emit drops to near-zero for 15 min. Catches:
        # RabbitMQ broker outage, audit-emit silently failing (SIEM gap).
        - alert: EnbuildHubAuditEventRateDrop
          expr: |
            sum(rate(enbuild_audit_events_emitted_total[5m])) < 0.1
          for: 15m
          labels:
            severity: ticket
            context: AuditPipeline
            rtm: CCM-32
          annotations:
            summary: "ENBUILD audit emit rate dropped below 0.1 events/sec for 15m"
            description: "Audit pipeline appears broken — RabbitMQ broker offline or audit emit failing silently. SIEM ingestion may have a gap."
        # PAGE — proto translation errors > 0/sec for 5 min. Steady-state
        # is 0; any sustained rate means a wire-format regression.
        - alert: EnbuildHubProtoTranslationErrors
          expr: |
            sum(rate(enbuild_proto_translation_errors_total[5m])) > 0
          for: 5m
          labels:
            severity: page
            context: ClusterRpcService
            rtm: CCM-08a
          annotations:
            summary: "ENBUILD hub proto-loader body translation regressed"
            description: "buildHubMessageBody returned an empty wireBody for a known action — proto-loader will silently drop the message. Roll back the most recent backend image."
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-enbuild-backend
  labels:
    app: bk
    app.kubernetes.io/component: backend
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.enbuildBk.replicas }}
  selector:
    matchLabels:
      app: bk
      app.kubernetes.io/component: backend
    {{- include "enbuild-helm-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /*
          FIX-E (G1, first-deploy findings): roll the backend automatically when
          its Keycloak issuer/URL config changes. KEYCLOAK_ISSUER / KEYCLOAK_URL /
          KEYCLOAK_BACKEND_URL ride {release}-backend-secret via envFrom and are
          read ONCE at process boot — so a helm upgrade that only re-points the
          issuer/URL updates the Secret but leaves the running pod verifying tokens
          against the OLD issuer (strict endpoints 401, catalog stuck "Loading
          templates…"). Checksumming just the KC issuer/URL values (mirrors the
          effective-issuer derivation in backend-secret.yaml) rolls the pod on
          exactly those changes, without coupling it to unrelated Secret edits.
        */}}
        {{- $kc := default (dict) .Values.enbuildBk.keycloak }}
        {{- $kcRealm := default "enbuild" $kc.realm }}
        {{- $kcIssuer := $kc.issuer }}
        {{- if and (not $kcIssuer) $kc.url }}
        {{- $kcIssuer = printf "%s/realms/%s" (trimSuffix "/" $kc.url) $kcRealm }}
        {{- end }}
        checksum/keycloak-config: {{ dict "issuer" $kcIssuer "url" $kc.url "backendUrl" $kc.backendUrl "realm" $kcRealm | toYaml | sha256sum }}
      labels:
        app: bk
        app.kubernetes.io/component: backend
      {{- include "enbuild-helm-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- /*
        CCM-08b idempotent-config (ADR-0029): bind the BE pod to the
        installer ServiceAccount minted in enbuild-bk-rbac.yaml. That SA
        carries the secrets/jobs/pods/configmaps/deployments perms the
        /clusters/install-agent endpoint needs. Without this binding the
        pod runs as the namespace default SA → install-agent 503s with
        `secrets is forbidden`. Static across release lifetime — no
        operator config needed (overridable via .Values.enbuildBk.serviceAccount
        if a future deployment mode needs a different SA).
      */}}
      serviceAccountName: {{ .Values.enbuildBk.serviceAccount | default (printf "%s-enbuild-bk-installer" .Release.Name) }}
      containers:
      - env:
        - name: MONGODB_ENDPOINT
          {{- /*
            mongo_endpoint_override is the escape hatch for production HA
            topologies (3-node replicaSet, cosmosDB, custom auth source).
            When set, it becomes MONGODB_ENDPOINT verbatim, bypassing the
            assembled URI built from USER/PASSWORD/SERVER. The assembled
            form (`mongodb://...@MONGO_SERVER`) lacks `?replicaSet=...&authSource=admin`
            so it breaks against HA Mongo deployments even when the password
            is correct. vendor13-ib hit this 2026-05-28: chart secret said
            `SuperSecret` but Mongo user store had the original chart default
            (`mongo_root_password`) — every new pod crashlooped on auth until
            we planted the literal URI via `kubectl set env`, which then got
            silently reverted on the next helm upgrade. Codified here so the
            literal URI survives.
          */}}
          {{- with .Values.mongodb.mongo_endpoint_override }}
          value: {{ . | quote }}
          {{- else }}
          value: mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@$(MONGO_SERVER)
          {{- end }}
        {{- /*
          BE 099 KubeProxyController demo-mode fallback actor. When
          Headlamp's HTTP requests carry no X-Actor-Email/JWT the
          controller falls back to this email before TenancyGuard
          (project-membership) runs. Folded into the chart 2026-05-19
          so the env survives helm-upgrade — prior `kubectl set env`
          patches were getting auto-reverted on rollouts. Skipped when
          empty so unset == hardcoded controller default
          (`alice@example.com`).
        */ -}}
        {{- with .Values.enbuildBk.kubeProxyFallbackActor }}
        - name: KUBE_PROXY_FALLBACK_ACTOR
          value: {{ . | quote }}
        {{- end }}
        {{- /*
          ADR-0046 console-auth cutover (audit finding F4 — previously the flag
          was readable only via `kubectl set env`, so the chart could not express
          "ship with strict on" and the cutover risked being a silent no-op).
          CONSOLE_AUTH_STRICT flips the production posture: deny tokenless
          console/proxy requests, authorize ONLY from the verified Keycloak token
          (no header/body/query fallback, no ADMIN_EMAILS data-path self-grant).
          Default unset = OFF (legacy least-privilege fallback) so the chart stays
          safe to roll before the coordinated cutover. Set
          enbuildBk.consoleAuthStrict=true IN THE SAME roll that enables Headlamp
          OIDC + exposes Keycloak at a real URL, else the console locks out. Pair
          with AUTH_MECHANISM=keycloak (enbuildBk.keycloak.*) — strict assumes
          verified tokens. See runbooks/console-auth-strict-cutover.md.
        */ -}}
        {{- if .Values.enbuildBk.consoleAuthStrict }}
        - name: CONSOLE_AUTH_STRICT
          value: "true"
        {{- end }}
        {{- /*
          ADR-0046 CA-10 spoke per-user impersonation. When true the proxy
          forwards Impersonate-User/-Group (verb-matched) from the VERIFIED token
          so the spoke apiserver's RBAC + audit attribute to the real user instead
          of the shared agent SA. MUST pair with the agent chart's
          rbac.consoleImpersonation.enabled=true (the spoke half) — without that
          grant + binding the impersonated identity is deny-all and the proxy
          breaks. Default unset = OFF.
        */ -}}
        {{- if .Values.enbuildBk.spokeImpersonation }}
        - name: SPOKE_IMPERSONATION
          value: "true"
        {{- end }}
        {{- /*
          ClusterRpcService timeout (ms) for hub→agent RPCs. Chart default
          10000 (2026-06-11 latency P0 — fail fast so one slow/dead agent
          RPC can't pin a console poll for 30s; the agent's old
          serial-dispatch bottleneck that motivated 30000 is gone). Empty =
          source default (10000). See values.yaml for history.
        */ -}}
        {{- with .Values.enbuildBk.clusterRpcTimeoutMs }}
        - name: CLUSTER_RPC_TIMEOUT_MS
          value: {{ . | quote }}
        {{- end }}
        {{- /*
          ADR-0035 fleet-aggregation snapshot store. These are the PERMANENT
          production defaults (both ON) — the per-cluster + fleet Security
          views read from the hub snapshot store (bounded, paginated) that the
          agents populate by pushing count-as-iterate summaries, instead of the
          unbounded live spoke fan-out. Validated live on vendor13-ib 2026-06-02.
            - SNAPSHOT_INGEST_ENABLED: accept agent-pushed security summaries.
            - SNAPSHOT_READ_FROM_STORE: serve Security reads from the store.
          Default "true". Set to "false" only for an emergency revert to the
          live-RPC path (the code keeps the live path + ?live=1 escape hatch).
        */}}
        - name: SNAPSHOT_INGEST_ENABLED
          value: {{ .Values.enbuildBk.snapshotIngestEnabled | default "true" | quote }}
        - name: SNAPSHOT_READ_FROM_STORE
          value: {{ .Values.enbuildBk.snapshotReadFromStore | default "true" | quote }}
        {{- /*
          BE 100 — KubeProxyCacheService tuning. Schema tier caches
          /openapi/v2 + discovery endpoints (long TTL); list tier
          caches resource lists (short TTL, matches Headlamp refresh
          cadence). maxEntries caps each tier independently to bound
          memory. Empty values fall back to source defaults
          (300 s / 10 s / 50).
        */ -}}
        {{- with (default (dict) .Values.enbuildBk.kubeProxyCache).schemaTtlSeconds }}
        - name: KUBE_PROXY_CACHE_SCHEMA_TTL_SECONDS
          value: {{ . | quote }}
        {{- end }}
        {{- with (default (dict) .Values.enbuildBk.kubeProxyCache).listTtlSeconds }}
        - name: KUBE_PROXY_CACHE_LIST_TTL_SECONDS
          value: {{ . | quote }}
        {{- end }}
        {{- with (default (dict) .Values.enbuildBk.kubeProxyCache).maxEntries }}
        - name: KUBE_PROXY_CACHE_MAX_ENTRIES
          value: {{ . | quote }}
        {{- end }}
        {{- /*
          CCM-08b idempotent-config (ADR-0029): non-secret install-agent
          configuration sourced from helm values so `helm upgrade --reuse-values`
          preserves them across every BE roll. Before this block existed, an
          operator post-installed `kubectl set env` against the deployment for
          each of these; those changes were wiped by the next chart upgrade.
          The sensitive counterparts (GITLAB_TOKEN, ENBUILD_REPO1_*) ride the
          envFrom secretRef below.
          nil-safe: under reuse-values from a release that predates this key,
          .Values.enbuildBk.installAgent is nil → default to empty dict; the
          downstream `default` calls cover the individual keys.
        */}}
        {{- $ia := default (dict) .Values.enbuildBk.installAgent }}
        - name: ENBUILD_HUB_AGENT_URL
          value: {{ default "" $ia.hubUrl | quote }}
        - name: ENBUILD_HUB_AGENT_TLS_SERVER_NAME
          value: {{ default "" $ia.tlsServerName | quote }}
        - name: ENBUILD_HUB_INTERNAL_IPS
          value: {{ default "" $ia.hubInternalIps | quote }}
        - name: ENBUILD_AGENT_IMAGE_TAG
          value: {{ default "" $ia.agentImageTag | quote }}
        - name: ENBUILD_AGENT_CHART_REPO
          value: {{ default "https://gitlab.com/enbuild-staging/iac-templates/platform-one-eks.git" $ia.chartRepo | quote }}
        - name: ENBUILD_AGENT_CHART_REF
          value: {{ default "main" $ia.chartRef | quote }}
        {{- /*
          Portability knobs (ADR-0049 follow-up). All default empty/registry1 so a
          stock P1/Iron Bank deploy is unchanged; a customer (e.g. AF P1 against
          repo1.dso.mil + their own registry) overrides these to make the import
          pull the agent image + the spoke private-registry secret from THEIR
          registry, with no code change. These are ALSO admin-settable at runtime
          (admin-settings → process.env), so this block is the deploy-time default.
          - repo1Registry         → spoke private-registry docker-server + pull-probe
          - agentImageRegistry/Repository → compose the agent image.repository override
          - agentImagePullSecret  → image.pullSecrets[0].name on the agent
        */}}
        - name: ENBUILD_REPO1_REGISTRY
          value: {{ default "registry1.dso.mil" $ia.repo1Registry | quote }}
        {{- /*
          ADR-0049 P2 — registry inheritance. When the operator configures the
          agent image PATH for a non-default registry (e.g. Iron Bank), the
          registry HOST defaults to the chart-wide `global.image.registry`. So
          `global.image.registry` becomes the SINGLE deploy-time lever for both
          the hub images AND the imported agent — set it once, the agent follows.
          An explicit `agentImageRegistry` still wins. With neither set (stock
          deploy) this stays empty → BE keeps the agent chart's own default, so a
          stock P1/Iron Bank deploy is unchanged and no "registry without repo"
          warning is emitted.
        */}}
        - name: ENBUILD_AGENT_IMAGE_REGISTRY
          {{- if or $ia.agentImageRegistry $ia.agentImageRepository }}
          value: {{ $ia.agentImageRegistry | default .Values.global.image.registry | quote }}
          {{- else }}
          value: ""
          {{- end }}
        - name: ENBUILD_AGENT_IMAGE_REPOSITORY
          value: {{ default "" $ia.agentImageRepository | quote }}
        - name: ENBUILD_AGENT_IMAGE_PULL_SECRET
          value: {{ default "" $ia.agentImagePullSecret | quote }}
        {{- /*
          SIEM CA trust (SOO §1.5). When the customer supplies their SIEM's CA in
          enbuildBk.observability.siem.caExistingSecret (key `ca.crt`), mount it
          (volume below) and point Node's trust bundle at it via a FIXED filename
          — /etc/siem-ca/ca.crt — so the env path and the secret key can never
          drift (the live hub's hand-patch pointed at ca.pem while the key was
          ca.crt → the CA silently never loaded). Read at pod BOOT, so a CA change
          needs a BE restart. Unset = no volume/env (publicly-trusted SIEM cert).
          The forwarder ALWAYS verifies TLS (no insecure-skip) — this is how a
          self-signed / private-CA SIEM is trusted, the day-one path.
        */}}
        {{- if (default (dict) (default (dict) .Values.enbuildBk.observability).siem).caExistingSecret }}
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/siem-ca/ca.crt
        {{- end }}
        envFrom:
        {{- /*
          MongoDB credentials. When mongodb.existingSecret is set the operator
          Secret is sourced directly (and templates/mongodb-secrets.yaml does
          not render a chart Secret); otherwise the chart-rendered
          {release}-mongo-secrets is used (local dev/test).
        */}}
        - secretRef:
            name: {{ .Values.mongodb.existingSecret | default (printf "%s-mongo-secrets" .Release.Name) }}
        - secretRef:
            name: {{ .Release.Name }}-backend-secret
        {{- /*
          At-rest ENCRYPTION_KEY from an operator-managed Secret (key
          ENCRYPTION_KEY). When set, backend-secret omits the inline key and
          this envFrom supplies it. Required in every real deployment.
        */ -}}
        {{- with (default (dict) .Values.enbuildBk.encryptionKey).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          Message-broker connection (RABBIT_MQ_CONNECTION_STRING) from an
          operator-managed Secret. When set, backend-secret omits the assembled
          connection string and this envFrom supplies it — keeps the broker
          password out of Helm values.
        */ -}}
        {{- with (default (dict) .Values.enbuildBk.messaging).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          P1 CCM Console — operator-managed secret support. When the
          operator pre-creates a Secret carrying GITLAB_TOKEN (and
          optionally GITLAB_HOST) and sets `gitlabPat.existingSecret`,
          its keys override the inline values from backend-secret. Lets
          P1 environments rotate the GitLab PAT without touching values.
        */ -}}
        {{- with .Values.enbuildBk.gitlabPat.existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          SSO / Keycloak SECRET auth keys. Operator pre-creates a Secret with
          KEYCLOAK_CLIENT_SECRET + KEYCLOAK_ADMIN_CLIENT_SECRET (and optionally
          KEYCLOAK_REALM_PUBLIC_KEY). Non-secret Keycloak config rides
          backend-secret. Recommended for production (authMechanism=keycloak).
        */ -}}
        {{- with (default (dict) .Values.enbuildBk.keycloak).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          P1 CCM Console — cosign export signing key (EN-1237). Operator
          pre-creates a Secret with key SIEM_SIGNING_KEY (PEM-encoded
          ECDSA P-256 private key). Strongly preferred over the inline
          `privateKeyPem` path for production.
        */ -}}
        {{- with .Values.enbuildBk.exportSigning.existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          P1 CCM Console — hub-self security tooling env (CCM-13d). Operator
          pre-creates a Secret carrying TWISTLOCK_API_URL/USERNAME/PASSWORD,
          ANCHORE_API_URL/USERNAME/PASSWORD, FALCO_CLUSTER_ID,
          FALCO_WEBHOOK_SECRET, OPA_GATEKEEPER_ENABLED, FALCO_AUDIT_LANE.
          Keeps Big Bang Twistlock/Anchore creds out of Helm values and
          rotatable out-of-band; also bridges them cross-namespace into
          the bk pod (creds live in the twistlock/anchore namespaces).
          Same operator-managed-secret idiom as gitlabPat/exportSigning.
        */ -}}
        {{- /* nil-safe: under `helm upgrade --reuse-values` the prior release's
           values predate this key, so .Values.enbuildBk.securityTooling is nil.
           default (dict) guards the dereference (every existing release). */ -}}
        {{- with (default (dict) .Values.enbuildBk.securityTooling).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          CCM-08b idempotent-config (ADR-0029): sensitive install-agent env
          (GITLAB_TOKEN, ENBUILD_REPO1_USER, ENBUILD_REPO1_TOKEN) sourced
          from an operator-pre-created Secret. Same operator-managed-secret
          idiom as gitlabPat/exportSigning/securityTooling above. When
          unset (default), the install-agent endpoint returns 503 with a
          clear error and NOTES.txt warns at install time. Rotation =
          recreate the Secret + rollout restart BE (envFrom values are
          read at pod start).
          nil-safe: see comment block above.
        */}}
        {{- with (default (dict) .Values.enbuildBk.installAgent).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          REAPER_SVC delete credential (CCM orphan-ELB permanent fix, 2026-06-28).
          REAPER_SVC_AWS_ACCESS_KEY_ID / REAPER_SVC_AWS_SECRET_ACCESS_KEY for the
          teardown Reaper's cloud-release GATE (AWS Describe poll) and its
          tag-then-delete residual SWEEP. WITHOUT this wired, teardown-creds
          forDelete returns null → cloudReleased() never confirms release (times
          out and hands off to terraform destroy with the ELB still live) and the
          sweep is a no-op → EVERY cluster destroy orphans the Istio gateway ELB.
          Same operator-managed existingSecret idiom as installAgent above;
          nil-safe (unset = pre-fix behavior). Rotation = recreate Secret +
          rollout restart BE (envFrom read at pod start).
        */}}
        {{- with (default (dict) .Values.enbuildBk.reaperSvc).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        {{- /*
          Observability & SIEM bearer tokens (SOO §1.5) from an operator-managed
          Secret. Expected keys (any subset): SIEM_AUTH_HEADER, PROMETHEUS_TOKEN,
          LOKI_TOKEN. Same operator-managed-secret idiom as keycloak/exportSigning
          above — keeps the SIEM/Prometheus/Loki credentials out of Helm values
          and rotatable out-of-band (recreate Secret + rollout restart BE; envFrom
          is read at pod start). The non-secret endpoints/toggles ride
          backend-secret. nil-safe under `helm upgrade --reuse-values`.
        */}}
        {{- with (default (dict) .Values.enbuildBk.observability).existingSecret }}
        - secretRef:
            name: {{ . }}
        {{- end }}
        # Image registry: per-service `enbuildBk.image.registry` override
        # wins over the chart-wide `global.image.registry`. Unset by default →
        # falls back to global, preserving every existing deploy's behavior.
        # Use case: vendor13-ib temporarily points at the GitLab staging
        # registry to consume a fix while waiting for the Iron Bank rebuild to
        # ship the same change. See examples/enbuild/values-vendor13-ib.yaml
        # for the override shape + intended temporary lifecycle.
        image: {{ default .Values.global.image.registry .Values.enbuildBk.image.registry }}/{{ .Values.enbuildBk.image.repository }}:{{ default .Chart.AppVersion (default .Values.global.AppVersion .Values.enbuildBk.image.tag) }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        {{- /*
          BE 099 health-probe gate (2026-05-21). bk's NestJS health check has
          a hardcoded `memory_rss` threshold (app.service.ts:30 — 250 MB at
          time of writing). K8sApiProxy buffers Headlamp's /openapi/v2
          responses (11 MB per call for Big Bang spokes), Node retains them
          past GC, RSS climbs past 250 in normal operation, /api/health
          returns 503, liveness kills the pod, gRPC streams to every spoke
          agent break. Until the source threshold is raised to 1 GB (and/or
          the K8sApiProxy gets streaming/caching), this gate lets the
          operator disable the probes per environment. Default true to
          preserve existing chart posture; vendor13-ib values flip false.
        */ -}}
        {{- /*
          Probes hit dedicated /api/health/live (heap-only, no RSS) and
          /api/health/ready (heap + mongo + disk) instead of the legacy
          combined /api/health. The combined endpoint includes RSS which
          climbs above threshold under normal K8sApiProxy buffering of
          Headlamp /openapi/v2 (11 MB per call on Big Bang spokes). The
          dedicated endpoints reflect the real K8s probe intent.
        */ -}}
        {{- if (default (dict) .Values.enbuildBk.healthProbe).enabled | default true }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/live
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        {{- end }}
        name: enbuild-bk
        ports:
        - containerPort: 8080
        {{- if .Values.enbuildBk.grpcEnabled }}
        - containerPort: 8443
          name: grpc
          protocol: TCP
        {{- end }}
        {{- if (default (dict) .Values.enbuildBk.healthProbe).enabled | default true }}
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/ready
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        {{- end }}
        resources: {{- toYaml .Values.enbuildBk.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        {{- if (default (dict) (default (dict) .Values.enbuildBk.observability).siem).caExistingSecret }}
        volumeMounts:
        - name: siem-ca
          mountPath: /etc/siem-ca
          readOnly: true
        {{- end }}
{{- if or .Values.global.imagePullSecretName .Values.global.image.registry_credentials }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecretName | default (printf "%s-image-pull-secret" .Release.Name) }}
{{- end }}
      {{- with (default (dict) (default (dict) .Values.enbuildBk.observability).siem).caExistingSecret }}
      volumes:
      - name: siem-ca
        secret:
          secretName: {{ . }}
          items:
          - key: ca.crt
            path: ca.crt
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-enbuild-backend
  labels:
    app: bk
    app.kubernetes.io/component: backend
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.enbuildBk.service_type }}
  selector:
    app: bk
    app.kubernetes.io/component: backend
  {{- include "enbuild-helm-chart.selectorLabels" . | nindent 4 }}
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080

{{- if and .Values.global.ingress.enabled (not .Values.global.create_istio_virtual_service )  -}}
{{- /* Fail-closed: an empty domain/hostname used to render `host: .` — an
       Ingress that silently routes nothing. */}}
{{- if or (not .Values.global.domain) (not .Values.enbuildUi.hostname) }}
{{- fail "global.ingress.enabled=true requires BOTH global.domain and enbuildUi.hostname (Ingress host = <enbuildUi.hostname>.<global.domain>; empty values render a broken host silently). Set both, or disable the edge for the port-forward profile (see examples/values-quickstart.yaml)." }}
{{- end }}
{{- if and .Values.global.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.global.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.global.ingress.annotations "kubernetes.io/ingress.class" .Values.global.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ .Release.Name }}-enbuild-ing
  labels:
      {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
  {{- with .Values.global.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.global.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- end }}
  {{- if .Values.global.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.enbuildUi.hostname }}.{{ .Values.global.domain }}
      secretName: {{ .Values.global.ingress.tls_secret }}
  {{- end }}
  rules:
    - host: {{ .Values.enbuildUi.hostname }}.{{ .Values.global.domain }}
      http:
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Release.Name }}-enbuild-ui
                port:
                  number: 80
{{- end }}
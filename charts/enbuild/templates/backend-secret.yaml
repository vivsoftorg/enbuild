apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-secret
  labels:
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
type: Opaque
data:
  ENVIRONMENT: cHJvZAo=
  {{- if eq (printf "%s" (default "" .Values.global.auth_plugin) | lower) "local" }}
  IS_LOCAL: {{ (printf "true" | b64enc ) }}
  {{- end }}
  {{- if .Values.global.disable_tls_gitlab }}
  NODE_TLS_REJECT_UNAUTHORIZED: {{ (printf "0" | b64enc ) }}
  {{- end }}

stringData:
  {{- /*
    At-rest ENCRYPTION_KEY. In every real deployment this is provided via an
    operator-managed Secret (enbuildBk.encryptionKey.existingSecret, key
    ENCRYPTION_KEY) — see docs/OPERATOR-DEPLOYMENT-GUIDE.md. When that ref is
    set the inline key below is OMITTED and the deployments envFrom the
    operator Secret instead. The inline `encryption_key` default is empty;
    NEVER commit a real key here. (Rotating ENCRYPTION_KEY re-keys at-rest
    data — treat as a data migration, not a config change.)
  */}}
  {{- if not (default (dict) .Values.enbuildBk.encryptionKey).existingSecret }}
  ENCRYPTION_KEY: "{{ .Values.enbuildBk.encryption_key }}"
  {{- end }}

  {{- /*
    Message-broker connection string. The broker password must never live in
    Helm values, so in every real deployment RABBIT_MQ_CONNECTION_STRING is
    provided via an operator-managed Secret (enbuildBk.messaging.existingSecret)
    that the deployments envFrom. The assembled fallback below is rendered only
    when no existingSecret is set (local dev/test with the bundled broker).
  */}}
  {{- if not (default (dict) .Values.enbuildBk.messaging).existingSecret }}
  {{- if .Values.rabbitmq.enabled }}
  RABBIT_MQ_CONNECTION_STRING: amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ .Release.Name }}-rabbitmq:5672/
  {{- else }}
  RABBIT_MQ_CONNECTION_STRING: amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ .Values.rabbitmq.host | default "localhost" }}:5672/
  {{- end }}
  {{- end }}
  RABBIT_MQ_ENV: "{{ .Values.rabbitmq.env }}"
  RABBITMQ_QUEUE_PREFIX: "{{ .Values.rabbitmq.queue_prefix }}"

  {{- /*
    Optional GitLab SCM connection config for catalog operations. The
    GITLAB_TOKEN admin credential is NEVER set here — it is supplied via the
    install-agent Secret (enbuildBk.installAgent.existingSecret) or
    enbuildBk.gitlabPat.existingSecret. This block only carries NON-secret
    connection config and is rendered only when enbuildBk.gitlabConnection is
    set. Leave unset to use the platform/per-catalog defaults (as the live
    vendor13-ib deploy does).
  */}}
  {{- with .Values.enbuildBk.gitlabConnection }}
  {{- with .host }}
  GITLAB_HOST: "{{ . }}"
  {{- end }}
  {{- with .group }}
  GITLAB_GROUP: "{{ . }}"
  {{- end }}
  {{- with .projectId }}
  GITLAB_PROJECT_ID: "{{ . }}"
  {{- end }}
  {{- with .namespaceId }}
  GITLAB_NAMESPACE_ID: "{{ . }}"
  {{- end }}
  {{- with .ref }}
  GITLAB_REF: "{{ . }}"
  {{- end }}
  {{- end }}

  {{- /*
    P1 CCM Console — SIEM signing key for /audit/export-bundle (EN-1237).
    When `enbuildBk.exportSigning.existingSecret` is set, the deployment
    adds an envFrom block for that operator-managed secret instead of
    inlining the PEM here. Recommended for production. The inline
    `privateKeyPem` path is dev/test only.
  */ -}}
  {{- if and (not .Values.enbuildBk.exportSigning.existingSecret) .Values.enbuildBk.exportSigning.privateKeyPem }}
  SIEM_SIGNING_KEY: |
{{ .Values.enbuildBk.exportSigning.privateKeyPem | indent 4 }}
  {{- end }}

  {{- /*
    SSO / authentication (Keycloak). Wires the backend's JWT-verifier config so a
    `helm install` is NOT spoofable "local" mode by default. The SECRET keys
    (KEYCLOAK_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET, optionally
    KEYCLOAK_REALM_PUBLIC_KEY) ride enbuildBk.keycloak.existingSecret via the
    deployment's envFrom — never here. This block carries only NON-secret config.

    FAIL-CLOSED: when authMechanism=keycloak we REQUIRE a realm public key (here or
    via existingSecret). Otherwise the render fails loudly instead of letting the
    backend silently accept unverified tokens. Set authMechanism=local for dev/test.
  */ -}}
  {{- $kc := default (dict) .Values.enbuildBk.keycloak }}
  {{- $mech := default "keycloak" .Values.enbuildBk.authMechanism }}
  {{- /*
    Fail-closed: in keycloak mode the backend MUST have a way to verify token
    signatures, else it could accept unverified tokens. Valid sources (any one):
      - enbuildBk.keycloak.backendUrl → in-cluster JWKS/discovery (the default,
        client-deployable path; also satisfied by the bundled keycloak.demoRealm).
      - enbuildBk.keycloak.realmPublicKey → pinned PEM (tunnel/offline fallback).
      - enbuildBk.keycloak.existingSecret → operator Secret carrying the key.
    The backend is JWKS-first, so backendUrl alone is sufficient (no key paste).
  */ -}}
  {{- if eq $mech "keycloak" }}
  {{- $jwksOk := or $kc.backendUrl (and .Values.keycloak.enabled (default (dict) .Values.keycloak.demoRealm).enabled) }}
  {{- if and (not $kc.realmPublicKey) (not $kc.existingSecret) (not $jwksOk) }}
  {{- fail "enbuildBk.authMechanism=keycloak requires a token-verification source: set enbuildBk.keycloak.backendUrl (in-cluster JWKS — recommended), OR enbuildBk.keycloak.realmPublicKey, OR enbuildBk.keycloak.existingSecret. Use authMechanism=local only for dev/test." }}
  {{- end }}
  {{- end }}
  AUTH_MECHANISM: "{{ $mech }}"
  {{- with .Values.enbuildBk.adminEmails }}
  ADMIN_EMAILS: "{{ . }}"
  {{- end }}
  {{- /*
    P1 CCM Console issuer-alignment INVARIANT (ADR-0046 CA-4, WORKSTREAM D2).
    The backend verifies JWTs by FETCHING JWKS keys in-cluster
    (KEYCLOAK_BACKEND_URL) while PINNING the issuer claim to the BROWSER-facing
    KEYCLOAK_ISSUER (jwt.verify is exact-match against the iss the SPA/Headlamp
    tokens are minted with). So these two MUST diverge in any gateway-exposed
    deployment:
      - KEYCLOAK_BACKEND_URL → in-cluster Keycloak base (e.g.
        http://enbuild-ib-keycloak:8080) — where JWKS/discovery is fetched.
      - KEYCLOAK_ISSUER      → exact browser issuer (e.g.
        https://keycloak-ib-vendor13.staging.dso.mil/realms/enbuild) — the iss
        claim the verifier pins.
    KEYCLOAK_ISSUER defaults to <url>/realms/<realm> when not set explicitly, so
    a standard IdP only needs `url` + `realm`. The pinned-key path
    (KEYCLOAK_REALM_PUBLIC_KEY) remains a FALLBACK for when the in-cluster JWKS
    URL is unreachable — JWKS-first, pinned-key second. Do not delete it.
  */}}
  {{- $kcRealm := default "enbuild" $kc.realm }}
  KEYCLOAK_REALM: "{{ $kcRealm }}"
  {{- with $kc.url }}
  KEYCLOAK_URL: "{{ . }}"
  {{- end }}
  {{- with $kc.backendUrl }}
  KEYCLOAK_BACKEND_URL: "{{ . }}"
  {{- end }}
  {{- $kcIssuer := $kc.issuer }}
  {{- if and (not $kcIssuer) $kc.url }}
  {{- $kcIssuer = printf "%s/realms/%s" (trimSuffix "/" $kc.url) $kcRealm }}
  {{- end }}
  {{- with $kcIssuer }}
  KEYCLOAK_ISSUER: "{{ . }}"
  {{- end }}
  {{- with $kc.clientId }}
  KEYCLOAK_CLIENT_ID: "{{ . }}"
  {{- end }}
  # ADR-0046 BLOCKER-1: the PUBLIC client the SPA + Headlamp mint USER tokens with
  # (token azp = enbuildUi.keycloak.clientId, the same client config.json hands the
  # browser). User-token verification accepts THIS or KEYCLOAK_CLIENT_ID, so the
  # backend validates browser/Headlamp tokens with no realm audience-mapper while
  # KEYCLOAK_CLIENT_ID stays the confidential backend/admin client.
  KEYCLOAK_PUBLIC_CLIENT_ID: "{{ .Values.enbuildUi.keycloak.clientId | default "enbuild-ui" }}"
  {{- with $kc.adminBaseUrl }}
  KEYCLOAK_ADMIN_BASE_URL: "{{ . }}"
  {{- end }}
  {{- with $kc.adminClientId }}
  KEYCLOAK_ADMIN_CLIENT_ID: "{{ . }}"
  {{- end }}
  {{- with $kc.realmPublicKey }}
  KEYCLOAK_REALM_PUBLIC_KEY: "{{ . }}"
  {{- end }}

{{- /*
  Keycloak DEMO realm AUTO-SEED — chart-shipped, DEMO-ONLY.

  Renders the `<release>-keycloak-secrets` Secret that templates/keycloak.yaml
  mounts for `start-dev --import-realm`. With this enabled a customer gets a
  WORKING SSO login (console + Headlamp OIDC + tenancy groups) from ONE host
  input — no hand-crafted realm export, no operator Secret to pre-create.

  WHEN THIS RENDERS:  keycloak.enabled AND keycloak.demoRealm.enabled.
  WHEN IT DOES NOT (operator-provided realm WINS):
    - keycloak.existingSecret is set  → operator ships their own realm Secret, OR
    - keycloak.demoRealm.enabled is false (the default).
  The guard below short-circuits on existingSecret so we NEVER collide with an
  operator Secret of the same name.

  ⚠️ DEMO-ONLY. The bundled realm (files/demo-realm-enbuild.json) carries
  plaintext personas (default password ChangeMe123!) and a change-me confidential
  client secret. Keycloak GENERATES the realm RSA signing key on import and HASHES
  these passwords — there is NO real key/cert/hash in git. For production: set
  keycloak.existingSecret (operator realm) and leave demoRealm.enabled=false, OR
  at minimum override keycloak.demoRealm.adminPassword and rotate every persona +
  the enbuild client secret.

  HOST ALIGNMENT (the "works every time" requirement): $consoleUrl below is the
  ONE browser console URL. It is substituted into the realm's enbuild-ui
  redirectUris/webOrigins (replacing __CONSOLE_URL__) so the realm the bundled
  Keycloak imports trusts the SAME host the SPA logs in from. Keep that host equal
  to enbuildUi.keycloak.url (FE config.json keycloakUrl) and to the host behind
  enbuildBk.keycloak.url (→ KEYCLOAK_ISSUER = <url>/realms/enbuild). KC_HOSTNAME
  (keycloak.hostname) stamps the issuer Keycloak mints; it must equal that host too.
*/ -}}
{{- if and .Values.keycloak.enabled (default (dict) .Values.keycloak.demoRealm).enabled }}
{{- if .Values.keycloak.existingSecret }}
{{- /* Operator realm Secret in play — do NOT render the demo seed. */ -}}
{{- else }}
{{- $demo := default (dict) .Values.keycloak.demoRealm }}
{{- /*
  Derive the browser console URL ($consoleUrl), in priority order:
    1. keycloak.demoRealm.consoleUrl explicit override, else
    2. https://<enbuildUi.hostname>.<global.domain> when BOTH are set, else
    3. http://localhost:8081  (port-forward demo — matches the realm's localhost URIs)
*/ -}}
{{- $consoleUrl := "" -}}
{{- if $demo.consoleUrl -}}
  {{- $consoleUrl = trimSuffix "/" $demo.consoleUrl -}}
{{- else if and .Values.enbuildUi.hostname .Values.global.domain -}}
  {{- $consoleUrl = printf "https://%s.%s" .Values.enbuildUi.hostname .Values.global.domain -}}
{{- else -}}
  {{- $consoleUrl = "http://localhost:8081" -}}
{{- end -}}
{{- $realmSource := .Files.Get "files/demo-realm-enbuild.json" -}}
{{- $realmObject := mustFromJson $realmSource -}}
{{- $writerClientSecret := "" -}}
{{- range $client := $realmObject.clients -}}
  {{- if eq (default "" $client.clientId) "enbuild" -}}
    {{- $writerClientSecret = default "" $client.secret -}}
  {{- end -}}
{{- end -}}
{{- if not $writerClientSecret -}}
  {{- fail "bundled demo realm is missing the confidential enbuild client secret required for Keycloak Project RBAC writes" -}}
{{- end -}}
{{- $realm := $realmSource | replace "__CONSOLE_URL__" $consoleUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak-secrets
  labels:
    {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    # DEMO-ONLY auto-seeded realm. Change passwords + client secret for production
    # (or set keycloak.existingSecret + keycloak.demoRealm.enabled=false).
    enbuild.io/demo-realm: "true"
type: Opaque
stringData:
  # Full demo realm with the console host ({{ $consoleUrl }}) substituted into the
  # enbuild-ui redirectUris/webOrigins. Imported via start-dev --import-realm.
  realm-enbuild.json: |-
{{ $realm | indent 4 }}
  # Bootstrap admin password (Keycloak master-realm admin). DEMO default ChangeMe123!.
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ $demo.adminPassword | default "ChangeMe123!" | quote }}
  # The same bundled confidential client credential imported by the realm. The
  # backend Deployment auto-imports these keys only on the demo-realm path, so
  # Project membership writes work immediately after a fresh chart install.
  # No credential value is duplicated in templates or values.
  KEYCLOAK_CLIENT_SECRET: {{ $writerClientSecret | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ $writerClientSecret | quote }}
{{- end }}
{{- end }}

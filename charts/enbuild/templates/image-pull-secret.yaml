{{- /*
  Opinionated registry-auth model: in real deployments the operator
  pre-creates a kubernetes.io/dockerconfigjson Secret and sets
  `global.imagePullSecretName` — no registry credentials live in Helm values.
  This chart Secret is rendered ONLY for local dev/test, when
  `global.image.registry_credentials` is supplied AND no imagePullSecretName is
  set. See docs/OPERATOR-DEPLOYMENT-GUIDE.md.
*/}}
{{- if and .Values.global.image.registry_credentials (not .Values.global.imagePullSecretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-image-pull-secret
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
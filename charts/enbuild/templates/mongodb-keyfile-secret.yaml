{{- $mongoReplicas := int (.Values.mongodb.replicaCount | default 1) -}}
{{- if and .Values.mongodb.enabled (gt $mongoReplicas 1) -}}
{{/*
Replica-set inter-member auth key. MongoDB rejects --replSet with auth enabled
unless a keyFile is provided (shared secret each member uses to authenticate to
peers during sync + heartbeat).

Generation strategy:
- lookup the existing secret first; if found, reuse its value verbatim.
  Critical for helm upgrade — a fresh randAlphaNum on every upgrade would
  break peer auth across all 3 replicas and the RS would lose quorum.
- Only on first install (lookup returns nil) generate a 1000-char random
  alphanumeric string. Mongo accepts 6-1024 byte keyfiles.

mountedAs `0400` to satisfy mongod's keyFile permission check.
*/ -}}
{{- $secretName := printf "%s-mongo-keyfile" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (index $existing.data "keyfile") -}}
{{- $key = index $existing.data "keyfile" -}}
{{- else -}}
{{- $key = randAlphaNum 1000 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: mongo
  {{- include "enbuild-helm-chart.labels" . | nindent 4 }}
type: Opaque
data:
  keyfile: {{ $key }}
{{- end }}

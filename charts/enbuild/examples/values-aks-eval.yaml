# =============================================================================
# ENBUILD hub — AKS EVAL layer  ·  ⚠️  THROWAWAY EVAL ONLY — NOT FOR PRODUCTION
# =============================================================================
# Layer AFTER the production AKS overlay:
#   helm ... -f examples/values-aks.yaml -f examples/values-aks-eval.yaml
#
# This swaps the production defaults for a self-contained eval on a cluster with
# NO real DNS/cert and NO external Keycloak users:
#   • a nip.io domain (resolves to the ingressgateway LB IP with zero DNS setup),
#   • LOCAL auth + a break-glass ADMIN_EMAILS allowlist (no Keycloak IdP needed),
#   • pinned build SHAs (the exact images validated in the 2026-07-05 Phase-A run),
#   • cheaper Standard_LRS storage.
# Every value here is an EVAL CONVENIENCE. Using this layer in a real deployment
# would ship the hub with authentication effectively open — do not.
# =============================================================================

global:
  # Standard_LRS is fine for a throwaway eval (production uses managed-csi-premium).
  storageClass: "managed-csi"
  # nip.io: <ip>.nip.io resolves to <ip> with no DNS records. Set to YOUR
  # ingressgateway external IP for the eval.
  domain: "48.216.154.225.nip.io"

mongodb:
  storageClassName: "managed-csi"

enbuildBk:
  # Pinned to the Phase-A validated backend build (dedup + launch fixes).
  image:
    tag: "f423a844eb26aabba15595025e7fb5aeaed15bec"
  # EVAL AUTH — LOCAL mode. The RolesGuard short-circuits to allow (no Keycloak
  # JWT needed) so the eval can browse catalogs + launch without an IdP. The
  # break-glass ADMIN_EMAILS list grants the tokenless Local-login user admin.
  # ⚠️ This is authentication effectively OFF — eval only.
  authMechanism: local
  adminEmails: "admin@local.com,admin@p1.mil"
  gitlabConnection:
    host: "https://gitlab.com/"
    namespaceId: "70306609"
  keycloak:
    url: https://keycloak.48.216.154.225.nip.io
  grpcVirtualService:
    host: "hub-grpc.48.216.154.225.nip.io"

enbuildUi:
  image:
    tag: "4046d3e39a466044366921b2ca4ba71ce7ab9ac1"
  keycloak:
    url: https://keycloak.48.216.154.225.nip.io

enbuildUser:
  image:
    tag: "8d473885fc7945166def7411dd1ba56954eb2404"

enbuildConsumer:
  image:
    tag: "93c52dfd602ec6c144079a51a7cd3ec9ec6f7da7"

keycloak:
  hostname: https://keycloak.48.216.154.225.nip.io
  virtualService:
    host: "keycloak.48.216.154.225.nip.io"
  # EVAL: bootstrap the bundled demo realm (seeds the demo admin@p1.mil user used
  # to log into the eval console). ⚠️ demo credentials — eval only.
  demoRealm:
    enabled: true

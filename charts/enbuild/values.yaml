    - npm
  args:
    - run
    - run:mq:all

## @section Keycloak (self-hosted SSO for platform login)
# Renders <release>-keycloak Deployment/Service when enabled. The realm + admin
# password come from an OPERATOR-PRE-CREATED Secret — never from these values.
keycloak:
  # [CUSTOMER] Run the platform's own SSO?
  #   true  -> the chart deploys a bundled Keycloak (<release>-keycloak) used for
  #            console login; requires the realm/admin Secret below.
  #   false -> NO bundled SSO is deployed. You must then either point the platform
  #            at an EXTERNAL Keycloak/IdP, or use the dev-only local-account mode
  #            (global.auth_plugin: local). With neither, console SSO login won't work.
  enabled: false
  # [CUSTOMER] Air-gap / Iron Bank image rebind + version pin.
  image: registry1.dso.mil/ironbank/opensource/keycloak/keycloak:25.0.6
  # [CUSTOMER] Operator Secret holding `realm-enbuild.json` + `KC_BOOTSTRAP_ADMIN_PASSWORD`.
  # Empty => "<release>-keycloak-secrets". See docs/OPERATOR-DEPLOYMENT-GUIDE.md.
  # NOTE: setting this DISABLES the demoRealm auto-seed below (operator realm wins).
  existingSecret: ""
  # --- [DEMO] Chart-shipped demo realm AUTO-SEED ---------------------------------
  # When enabled (AND keycloak.existingSecret is empty), the chart renders the
  # `<release>-keycloak-secrets` Secret from the bundled files/demo-realm-enbuild.json
  # so the bundled Keycloak boots a WORKING SSO login (console + Headlamp OIDC +
  # tenancy groups) with ZERO operator realm prep. The realm ships NO real signing
  # keys/certs/secrets — Keycloak generates the RSA key + hashes the demo passwords
  # on import. DEMO-ONLY: change every persona password + the enbuild client secret
  # (or use keycloak.existingSecret with your own realm) before any non-demo use.
  #
  # ONE-HOST CONTRACT — to wire a clean browser SSO demo a customer sets only these,
  # ALL pointing at the SAME Keycloak browser host https://<host> (do NOT hand-edit
  # any per-URL list — the chart derives them):
  #   1. keycloak.demoRealm.enabled: true
  #   2. keycloak.hostname:            https://<host>   (KC_HOSTNAME — the issuer Keycloak mints)
  #   3. enbuildUi.keycloak.url:       https://<host>   (FE config.json keycloakUrl)
  #   4. enbuildBk.keycloak.url:       https://<host>   (→ KEYCLOAK_ISSUER = https://<host>/realms/enbuild)
  #      enbuildBk.keycloak.backendUrl: http://<release>-keycloak:8080  (in-cluster JWKS fetch)
  # The realm's enbuild-ui redirectUris/webOrigins are auto-populated with the
  # browser CONSOLE URL the SPA logs in from — sourced (in priority) from:
  #   a. keycloak.demoRealm.consoleUrl override, else
  #   b. https://<enbuildUi.hostname>.<global.domain> (set these when the console FQDN
  #      IS the host above — the common bundled case where Keycloak rides the same
  #      gateway FQDN), else
  #   c. http://localhost:8081 (the port-forward demo).
  # If your Keycloak browser host differs from the console FQDN, set consoleUrl to the
  # console FQDN so the realm trusts the SPA origin. localhost:8081 is ALWAYS included
  # too (port-forward testing). realm == "enbuild" everywhere. For a pure port-forward
  # demo, leave 2-4 + a/b unset and reach the console at http://localhost:8081.
  # [DEMO] Bundled-Keycloak demo realm auto-seed — the "deploy & log in in minutes"
  # path. See README.md §3a "Console login & multi-tenancy" for the full walkthrough
  # + the persona table. ONE-HOST CONTRACT (set all to the same browser-facing
  # Keycloak URL, else login silently fails on an issuer mismatch):
  #   keycloak.hostname == enbuildUi.keycloak.url == enbuildBk.keycloak.url == https://<kc-host>
  #   enbuildBk.keycloak.backendUrl = http://<release>-keycloak:8080  (in-cluster JWKS)
  # Personas (all password ChangeMe123!): admin@p1.mil (whole fleet), owner-bb@p1.mil
  # (big-bang only), owner-ib@p1.mil (iron-bank only — proves cross-project denial),
  # viewer-ib@p1.mil (read-only). Production: use Path B (your own realm) or change
  # every default here.
  demoRealm:
    enabled: false                # [DEMO] true => auto-seed the demo realm Secret
    adminPassword: "ChangeMe123!" # [DEMO] KC_BOOTSTRAP_ADMIN_PASSWORD — change for prod
    consoleUrl: ""                # [DEMO] override browser console URL baked into the realm's
                                  # enbuild-ui redirectUris/webOrigins. Empty =>
                                  # https://<enbuildUi.hostname>.<global.domain>, else
                                  # http://localhost:8081 (port-forward demo).
  # [CUSTOMER] Keycloak capacity.
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # [CUSTOMER] KC_HOSTNAME — the frontend/issuer URL Keycloak stamps into tokens
  # and OIDC discovery. Default localhost:8088 = the port-forward dev model. For
  # browser SSO / Headlamp OIDC, set this to the gateway-exposed URL (see
  # virtualService) and align the backend KEYCLOAK_ISSUER to the SAME value.
  hostname: http://localhost:8088
  adminUser: admin
  # [CUSTOMER] ADR-0046 CA-4 — expose Keycloak on the platform's Istio gateway so
  # a browser (gateway ELB + /etc/hosts) can complete the OIDC flow. Default OFF;
  # enable at the CONSOLE_AUTH_STRICT cutover. `host` MUST sit directly under the
  # gateway's wildcard-cert domain (e.g. <name>.staging.dso.mil) to keep TLS valid.
  virtualService:
    enabled: false
    host: ""
    gateway: istio-gateway/public-ingressgateway

## @section PKI (hub/spoke cert-manager — Design A self-signed, ADR-0004)
pki:
  # [CUSTOMER] Leave FALSE in normal operation — the cert-manager
  # `enbuild-hub-issuer` ClusterIssuer (which renews the hub/spoke mTLS certs)
  # already exists and the chart leaves it alone (no-op).
  # Set TRUE for a SINGLE roll ONLY if that ClusterIssuer has gone missing: the
  # chart then re-creates it pointing at the EXISTING CA secret (caSecretName) to
  # restore cert renewal. It does NOT regenerate the CA or rotate any cert. After
  # that one roll, set it back to false.
  recreateHubIssuer: false
  # [INTERNAL] fixed cert-manager object names for the hub gRPC/pull-agent mTLS fabric.
  hubIssuerName: enbuild-hub-issuer
  caSecretName: enbuild-ca-tls

## @section Headlamp (embedded cluster console — only optional subchart)
# Only image.* / replicaCount / resources / spokes are operator knobs. The rest
# is the platform's Headlamp integration (chart-managed kubeconfig + theme
# ConfigMaps, white-label volume mounts) — do not override.
# NOTE (hardening follow-up): clusterRoleBinding.clusterRoleName is cluster-admin
# (unchanged from live); scope to a read-only ClusterRole in a later pass.
headlamp:
  # Default values for headlamp.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.

  # -- Number of desired pods
  replicaCount: 1

  image:
    # -- Container image registry
    registry: ghcr.io
    # -- Container image name
    repository: headlamp-k8s/headlamp
    # -- Image pull policy. One of Always, Never, IfNotPresent
    pullPolicy: IfNotPresent
    # -- Container image tag, If "" uses appVersion in Chart.yaml
    tag: ""

  # -- ENBUILD spoke clusters Headlamp should be able to view. Each entry is
  # the cluster id used in the BE K8sApiProxy URL path
  # (/api/v1/clusters/<id>/k8s-api). The chart renders one cluster+context
  # per entry into the chart-managed `headlamp-kubeconfigs` ConfigMap, all
  # sharing the `anon` user (tenancy enforced downstream by BE
  # KubeProxyController + agent stream). Default empty (only `main`).
  #
  # Example (set via values override or --set):
  #   headlamp:
  #     spokes:
  #       - ccm-vendor13-eks-final
  #       - ccm-vendor13-demo3
  #
  # For multi-tenant scale (hundreds of spokes), this manual values list
  # is replaced by a BE projector endpoint that renders the kubeconfig
  # dynamically from the agent registry — see CODIFICATION.md "Unit 2".
  spokes: []

  # -- An optional list of references to secrets in the same namespace to use for pulling any of the images used
  imagePullSecrets: []
  # -- Overrides the name of the chart
  nameOverride: ""
  # -- Overrides the full name of the chart
  fullnameOverride: ""

  # -- Override the deployment namespace; defaults to .Release.Namespace
  namespaceOverride: ""

  # -- An optional list of init containers to be run before the main containers.
  # NOTE: BOTH prior init containers were removed 2026-05-19 in favor of
  # chart-managed ConfigMaps that survive helm-upgrade / auto-reconcile:
  #
  #  - `headlamp-plugins` init container (pulled external
  #    ghcr.io/vivsoftorg/enbuild-headlamp-theme image into a PVC) →
  #    replaced by templates/headlamp-plugin-configmap.yaml
  #    (`headlamp-plugin-enbuild-theme`), mounted at
  #    /headlamp/plugins/enbuild-theme.
  #  - `create-kubeconfig` init container (built only the `main` context
  #    into an emptyDir) → replaced by
  #    templates/headlamp-kubeconfigs-configmap.yaml (`headlamp-kubeconfigs`)
  #    which holds `main` PLUS every spoke from .Values.headlamp.spokes,
  #    mounted at /home/headlamp/.config/Headlamp/kubeconfigs/config.
  #
  # No external image dependency, no PVC, no init-container — operator
  # patches stop getting reverted on the next BE/headlamp roll.
  initContainers: []
  config:
    inCluster: true
    # -- base url path at which headlamp should run
    baseURL: "/headlamp"
    oidc:
      # Option 1:
      # @param config.oidc.secret - OIDC secret configuration
      # If you want to use an existing secret, set create to false and provide the name of the secret.
      # If you want to create a new secret, set create to true and provide the name of the secret.
      # Also provide the values for clientID, clientSecret, issuerURL, and scopes.
      # Example:
      # config:
      #   oidc:
      #     secret:
      #       create: true
      #       name: oidc
      secret:
        # -- Generate OIDC secret. If true, will generate a secret using .config.oidc.
        create: false
        # -- Name of the OIDC secret.
        name: oidc

      # Option 2:
      # @param config.oidc - OIDC env configuration
      # If you want to set the OIDC configuration directly, set the following values.
      # Example:
      # config:
      #   oidc:
      #     clientID: "clientID"
      #     clientSecret: "clientSecret"
      #     issuerURL: "issuerURL"
      #     scopes: "scopes"

      # ADR-0046 CA-4 / WORKSTREAM D3 — Headlamp forwards the user's verified
      # Keycloak JWT to the hub backend proxy (the precondition for the
      # CONSOLE_AUTH_STRICT cutover: with strict on a token-less console request
      # is denied, so Headlamp MUST authenticate the user via OIDC).
      #
      # SHARED CONTRACT (must match the SPA + backend):
      #   clientID  = the public PKCE client "enbuild-ui" (same client the SPA
      #               uses; realm "enbuild"). NO clientSecret (public/PKCE).
      #   issuerURL = MUST equal the backend KEYCLOAK_ISSUER EXACTLY — the
      #               BROWSER-facing issuer (e.g.
      #               https://keycloak-ib-vendor13.staging.dso.mil/realms/enbuild).
      #               jwt.verify pins iss exact-match; a mismatch fails every
      #               proxied request. ENVIRONMENT-SPECIFIC → left empty here.
      #   scopes    = "openid email groups" — `groups` is REQUIRED so the hub
      #               TenancyGuard receives /enbuild/projects/<slug>/<role> +
      #               /enbuild/platform-admins claims.
      #   callbackURL = https://<console-host>/headlamp/oidc-callback — register
      #               this as a redirect URI on the realm's enbuild-ui client.
      #               ENVIRONMENT-SPECIFIC → left empty here.
      #
      # OFF-by-default / cutover discipline: the upstream Headlamp subchart emits
      # a `-oidc-<flag>` for EACH non-empty field INDEPENDENTLY, so setting only
      # some fields ships a PARTIAL (broken) OIDC config — Headlamp would start
      # with `-oidc-client-id`/`-oidc-scopes` but no issuer and fail login. To
      # keep a default install fully OFF (until the coordinated CONSOLE_AUTH_STRICT
      # cutover), ALL FOUR fields are left EMPTY here and enabled together as one
      # block. The canonical values to set (verbatim) are:
      #   clientID:  enbuild-ui            (shared public PKCE client; == backend KEYCLOAK_CLIENT_ID)
      #   scopes:    "openid email groups" (`groups` REQUIRED for tenancy)
      #   issuerURL: <browser KEYCLOAK_ISSUER, EXACT>
      #   callbackURL: https://<console-host>/headlamp/oidc-callback
      # See the (commented, ready-to-uncomment) full block in
      # examples/enbuild/values-vendor13-ib.yaml.
      # -- OIDC client ID — set to enbuild-ui at cutover (shared public PKCE client)
      clientID: ""
      # -- OIDC client secret — EMPTY (public/PKCE client; no secret)
      clientSecret: ""
      # -- OIDC issuer URL — MUST equal the backend KEYCLOAK_ISSUER (exact). Set at cutover.
      issuerURL: ""
      # -- OIDC scopes — set to "openid email groups" at cutover (`groups` REQUIRED for tenancy)
      scopes: ""
      # -- OIDC callback URL (https://<console-host>/headlamp/oidc-callback). Set at cutover.
      callbackURL: ""

      # -- OIDC client to be used during token validation
      validatorClientID: ""
      # -- OIDC Issuer URL to be used during token validation
      validatorIssuerURL: ""
      # -- Use 'access_token' instead of 'id_token' when authenticating using OIDC
      useAccessToken: false

      # Option 3:
      # @param config.oidc - External OIDC secret configuration
      # If you want to use an external secret for OIDC configuration, enable this option.
      # Provide the name of the secret to use.
      # Example:
      # config:
      #   oidc:
      #     secret:
      #       create: false
      #     externalSecret:
      #       enabled: true
      #       name: oidc
      externalSecret:
        enabled: false
        name: ""
    # -- directory to look for plugins
    pluginsDir: "/headlamp/plugins"
    watchPlugins: false
    # tlsCertPath: "/headlamp-cert/headlamp-ca.crt"
    # tlsKeyPath: "/headlamp-cert/headlamp-tls.key"
    # Extra arguments that can be given to the container. See charts/headlamp/README.md for more information.
    extraArgs:
      - "-enable-dynamic-clusters"

  # -- An optional list of environment variables
  # env:
  #   - name: KUBERNETES_SERVICE_HOST
  #     value: "localhost"
  #   - name: KUBERNETES_SERVICE_PORT
  #     value: "6443"

  # -- Mount Service Account token in pod
  automountServiceAccountToken: true

  serviceAccount:
    # -- Specifies whether a service account should be created
    create: true
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.(If not set and create is true, a name is generated using the fullname template)
    name: ""

  clusterRoleBinding:
    # -- Specified whether a cluster role binding should be created
    create: true
    # -- Set name of the Cluster Role with limited permissions from you cluster
    # for example - clusterRoleName: user-ro
    clusterRoleName: cluster-admin
    # -- Annotations to add to the cluster role binding
    annotations: {}

  # -- Annotations to add to the deployment
  deploymentAnnotations: {}

  # -- Annotations to add to the pod
  podAnnotations: {}

  # -- Labels to add to the pod
  podLabels: {}

  # -- Headlamp pod's Security Context
  podSecurityContext:
    {}
    # fsGroup: 2000

  # -- Headlamp containers Security Context
  securityContext:
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    runAsNonRoot: true
    privileged: false
    runAsUser: 100
    runAsGroup: 101
  # Uses these defaults if this is empty.
  #   allowPrivilegeEscalation: false
  #   runAsNonRoot: true
  #   seccompProfile:
  #     type: RuntimeDefault
  #   capabilities:
  #     drop:
  #       - ALL


  service:
    # -- Annotations to add to the service
    annotations: {}
    # -- Kubernetes Service type
    type: ClusterIP
    # -- Kubernetes Service port
    port: 80
    # -- Kubernetes Service clusterIP
    clusterIP: ""
    # -- Kubernetes Service loadBalancerIP
    loadBalancerIP: ""
    # -- Kubernetes Service loadBalancerSourceRanges
    loadBalancerSourceRanges: []
    # -- Kubernetes Service Nodeport
    nodePort: null

  # -- Headlamp containers volume mounts
  volumeMounts:
    # Plugin mounts as a subdir of pluginsDir (/headlamp/plugins) so Headlamp
    # detects it as the `enbuild-theme` plugin (main.js + package.json).
    - mountPath: /headlamp/plugins/enbuild-theme
      name: headlamp-plugins
      readOnly: true

    - mountPath: /home/headlamp/.config/Headlamp/kubeconfigs/config
      name: kubeconfig
      readOnly: true
      subPath: config

  # -- Headlamp pod's volumes
  volumes:
    # ENBUILD theme plugin — chart-managed ConfigMap (folded in 2026-05-19,
    # replacing the external-image init-container + PVC). Static CM name
    # because subchart values can't template {{ .Release.Name }}.
    - name: headlamp-plugins
      configMap:
        name: headlamp-plugin-enbuild-theme
    # Chart-managed kubeconfig CM (folded 2026-05-19). Holds `main` + every
    # spoke listed in .Values.headlamp.spokes. Static CM name because
    # subchart values can't template {{ .Release.Name }}.
    - name: kubeconfig
      configMap:
        name: headlamp-kubeconfigs
        items:
          - key: config
            path: config

  persistentVolumeClaim:
    # -- Enable Persistent Volume Claim
    enabled: false
    # -- Annotations to add to the persistent volume claim (if enabled)
    annotations:
      {}
    # -- accessModes for the persistent volume claim, eg: ReadWriteOnce, ReadOnlyMany, ReadWriteMany etc.
    accessModes:
      - ReadWriteOnce
    # -- size of the persistent volume claim, eg: 10Gi. Required if enabled is true.
    size: "1Gi"
    # -- storageClassName for the persistent volume claim.
    storageClassName: ""
    # -- selector for the persistent volume claim.
    selector: {}
    # -- volumeMode for the persistent volume claim, eg: Filesystem, Block.
    volumeMode: ""

  ingress:
    # -- Enable ingress controller resource
    enabled: false
    # -- Annotations for Ingress resource
    annotations:
      {}
      # kubernetes.io/tls-acme: "true"

    # -- Additional labels to add to the Ingress resource
    labels: {}
      # app.kubernetes.io/part-of: traefik
      # environment: prod

    # -- Ingress class name. replacement for the deprecated "kubernetes.io/ingress.class" annotation
    ingressClassName: ""

    # -- Hostname(s) for the Ingress resource
    # Please refer to https://kubernetes.io/docs/reference/kubernetes-api/service-resources/ingress-v1/#IngressSpec for more information.
    hosts:
      []
      # - host: chart-example.local
      #   paths:
      #   - path: /
      #     type: ImplementationSpecific
    # -- Ingress TLS configuration
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # -- CPU/Memory resource requests/limits
  resources:
    {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # -- Node labels for pod assignment
  nodeSelector: {}

  # -- Toleration labels for pod assignment
  tolerations: []

  # -- Affinity settings for pod assignment
  affinity: {}

  # Plugin Manager Sidecar Container Configuration
  pluginsManager:
    # -- Enable plugin manager
    enabled: false
    # -- Plugin configuration file name
    configFile: "plugin.yml"
    # -- Plugin configuration content in YAML format. This is required if plugins.enabled is true.
    configContent: ""
    # -- Base node image to use
    baseImage: node:lts-alpine
    # -- Headlamp plugin package version to install
    version: latest
    # -- Plugin manager env variable configuration
    # env:
    # - name: HTTPS_PROXY
    #   value: "proxy.example.com:8080"
    # -- Specify resrouces
    # resources:
    #   requests:
    #     cpu: "500m"
    #     memory: "2048Mi"
    #   limits:
    #     cpu: "1000m"
    #     memory: "4096Mi"
    # If omitted, the plugin manager will inherit the global securityContext
    securityContext:
      {}
      # runAsUser: 1001
      # runAsNonRoot: true
      # allowPrivilegeEscalation: false
      # readOnlyRootFilesystem: true
      # capabilities:
      #   drop:
      #     - ALL

  podDisruptionBudget:
    # -- enable PodDisruptionBudget
    # ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
    enabled: false
    # @schema
    # type: [null, integer, string]
    # @schema
    # -- Minimum number/percentage of pods that should remain scheduled.
    # When it's set, maxUnavailable must be disabled by `maxUnavailable: null`
    minAvailable: 0
    # @schema
    # type: [null, integer, string]
    # @schema
    # -- Maximum number/percentage of pods that may be made unavailable
    maxUnavailable: null
    # @schema
    # type: [null, string]
    # @schema
    # -- How are unhealthy, but running, pods counted for eviction
    unhealthyPodEvictionPolicy: null

  # -- Additional Kubernetes manifests to be deployed. Include the manifest as nested YAML.
  extraManifests: []
  # - |
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: my-config
  #   data:
  #     key: value
  # - |
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: my-config-too
  #   data:
  #     key: value

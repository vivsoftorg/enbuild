# =============================================================================
# ENBUILD HUB PLATFORM — Helm values
# =============================================================================
# This chart is OPINIONATED. The platform decides HOW it runs; you only bind
# WHERE it runs. Within each section, values are grouped as:
#
#   [CUSTOMER]  — set these per environment (DNS, gateway, image registry +
#                 tags, capacity, references to operator-created credential
#                 Secrets).
#   [INTERNAL]  — platform wiring with exactly one correct value. Overriding
#                 these is unsupported and the usual cause of broken deploys.
#
# Credentials are NEVER stored in this file. They are provided via
# operator-created Kubernetes Secrets referenced by *.existingSecret /
# global.imagePullSecretName. See docs/OPERATOR-DEPLOYMENT-GUIDE.md for the
# required Secrets, what each powers (catalog deployments, cluster launches,
# agent installs, image pulls, SSO), and the kubectl commands to create them.
#
# Full rationale: docs/VALUES-OPINIONATION-AUDIT.md
# =============================================================================

## @section Global parameters
global:
  # [CUSTOMER] DNS suffix for hub ingress hosts + cert SANs.
  # `<enbuildUi.hostname>.<global.domain>` = console FQDN.
  domain: ""
  # [CUSTOMER] true only when GitLab presents a self-signed/untrusted cert.
  disable_tls_gitlab: false
  # [CUSTOMER] Edge exposure — use EITHER istio OR ingress, not both.
  istio:
    enabled: true                 # expose via an Istio Gateway
    gateway: istio-system/main    # <namespace>/<gateway>
  ingress:
    enabled: false
    tls: false
    tls_secret: ""                # pre-created TLS cert Secret when tls=true
    className: ""                 # IngressClass name (standardized key)
    annotations: {}
  # [CUSTOMER] Pre-created kubernetes.io/dockerconfigjson Secret for private/
  # Iron Bank registry pulls. REQUIRED for private registries; keeps registry
  # creds out of values entirely. (kubectl create secret docker-registry ...)
  imagePullSecretName: ""
  # [CUSTOMER] StorageClass for stateful deps. Empty = cluster default.
  storageClass: ""
  image:
    # [CUSTOMER] Registry all first-party images pull from (air-gap rebind).
    registry: registry1.dso.mil
    # [CUSTOMER] Always | IfNotPresent | Never (air-gap → IfNotPresent).
    pullPolicy: Always
    # [INTERNAL] Dev/test inline registry creds (renders a chart Secret). Leave
    # EMPTY in real deployments — use global.imagePullSecretName. NEVER commit creds.
    registry_credentials: {}

  # [INTERNAL] All first-party images share one version; empty = track chart
  # appVersion. This is the middle fallback in the image-tag chain — keep declared.
  AppVersion: ""
  # [INTERNAL] "" = Keycloak/SSO (operator-managed). "local" = dev local-account fallback.
  auth_plugin: ""
  # [INTERNAL] true (+ ingress.enabled) renders a plain Ingress instead of the
  # frontend Istio VirtualService. Default false (mesh path).
  create_istio_virtual_service: false
  # [INTERNAL] Dev-only second registry (GitLab) creds. Leave empty; never commit.
  gitlabRegistryCredentials: {}

## @section Lightning features
# Only operator-toggleable feature. Bolt / JupyterHub / CTF / AI / monitoring
# were removed from the chart in 0.1.0 (OFF in every environment); their flags
# are now hardcoded false in the frontend config.
lightning_features:
  operations_lightning:
    # [CUSTOMER] Deploy the embedded Headlamp cluster console + integration.
    headlamp: true

## @section Message broker (RabbitMQ) — core, bundled
rabbitmq:
  # [CUSTOMER] true = bundle the in-cluster broker (recommended). false = use
  # an external broker (set enbuildBk.messaging.existingSecret).
  enabled: true
  persistence:
    size: 8Gi                     # [CUSTOMER] broker volume size
  auth:
    username: enbuild             # [CUSTOMER] broker username (non-secret)
    # [CUSTOMER] Operator Secret (key `rabbitmq-password`) — broker password. REQUIRED.
    existingPasswordSecret: ""
    # [CUSTOMER] Operator Secret (key `rabbitmq-erlang-cookie`) — clustering cookie. REQUIRED.
    existingErlangSecret: ""
    # [INTERNAL] honour the existing-secret password after a PVC wipe (T1.2).
    securePassword: false
    # [INTERNAL] inline creds EMPTY by design — provide via existing*Secret above.
    password: ""
    erlangCookie: ""
  image:
    # [CUSTOMER] Air-gap / Iron Bank rebind + version pin.
    registry: registry1.dso.mil
    repository: ironbank/bitnami/rabbitmq
    tag: "3.12.14"
  # [INTERNAL]
  replicaCount: 1
  clustering:
    forceBoot: true
  host: rabbitmq.rabbitmq         # external host (only when enabled=false, dev)
  env: prod
  queue_prefix: enbuild

## @section Database (MongoDB)
# The platform ALWAYS needs MongoDB (launch/catalog state store). `enabled` does
# NOT turn Mongo on/off — it only chooses WHERE it runs:
#   enabled: true  -> the chart deploys a bundled single-node Mongo (dev/small).
#   enabled: false -> you run Mongo yourself (managed / HA replica set / DocumentDB)
#                     and point at it via `mongo_endpoint_override` below.
# Either way Mongo must exist. Live vendor13-ib uses false (external 3-node HA).
mongodb:
  # [CUSTOMER] true = bundle a single-node Mongo; false = use external Mongo (set
  # existingSecret + mongo_endpoint_override). NOT a Mongo on/off switch.
  enabled: false
  # [CUSTOMER] Operator Secret with MONGO_INITDB_ROOT_USERNAME /
  # MONGO_INITDB_ROOT_PASSWORD / MONGO_INITDB_DATABASE / MONGO_SERVER. REQUIRED.
  # When set, no Mongo credential Secret is rendered and the password stays out of values.
  existingSecret: ""
  # [CUSTOMER] Verbatim MONGODB_ENDPOINT for external/HA Mongo. Reference the
  # password via $(MONGO_INITDB_ROOT_PASSWORD) so NO secret appears here, e.g.:
  #   mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@h1:27017,h2:27017/?replicaSet=rs0&authSource=admin
  # Empty = assemble a single-node URI from the existingSecret fields.
  mongo_endpoint_override: ""
  # [CUSTOMER] StorageClass for the bundled Mongo PVC (enabled=true only).
  storageClassName: ""
  image:
    # [CUSTOMER] bundled-Mongo image (enabled=true only). The Mongo base image is an
    # Iron Bank image on registry1.dso.mil, which is usually a DIFFERENT registry
    # from the ENBUILD app images (global.image.registry). Set registry here so the
    # bundled Mongo pulls from the right place independently. Empty → global.image.registry.
    registry: ""
    repository: ironbank/opensource/mongodb/mongodb
    tag: 4.4.5
  # [INTERNAL] inline creds EMPTY by design — provide via mongodb.existingSecret.
  mongo_root_username: ""
  mongo_root_password: ""
  mongo_server: ""

## @section ENBUILD Console (frontend / UI)
enbuildUi:
  # [CUSTOMER] Console hostname. `hostname.global.domain` = FQDN.
  hostname: ""
  replicas: 1                     # [CUSTOMER]
  # [CUSTOMER] Console dashboard iframe URLs — point at THIS env's observability.
  kiali_url: "/kiali/"
  grafana_url: "/grafana/d/os6Bh8Omk/kubernetes-cluster?orgId=1&refresh=30s"
  loki_url: "/grafana/d/liz0yRCZz/logs-app?orgId=1"
  kubecost_url: "kubecost/overview.html"
  # --- [CUSTOMER] P1 CCM Console runtime config (WORKSTREAM D1, ADR-0046 CA-4) ---
  # Emitted as config.json (frontend-config ConfigMap) and served by the console
  # nginx at /p1-ccm-console/config.json; the SPA fetches it at boot and stashes
  # it on window.__P1CCM_CONFIG. SHARED CONTRACT keys: keycloakUrl, keycloakRealm,
  # keycloakClientId, apiBase. These configure the BROWSER's OIDC login (the SPA
  # is a PUBLIC PKCE client) — no secrets here.
  keycloak:
    # Browser-facing Keycloak base URL the SPA redirects to for login. The SPA
    # builds the OIDC authority as <url>/realms/<realm>. Empty = no SSO wired
    # (set this + clientId at the cutover). e.g. https://keycloak-ib-vendor13.staging.dso.mil
    url: ""
    # Realm name. Empty → inherits enbuildBk.keycloak.realm (default "enbuild"),
    # so SPA + backend stay on the same realm from a single override.
    realm: ""
    # Public OIDC client the SPA (and Headlamp) share. Empty → defaults to
    # "enbuild-ui" (the public PKCE client; MUST match backend KEYCLOAK_CLIENT_ID
    # and headlamp.config.oidc.clientID). Distinct from the CONFIDENTIAL backend
    # client enbuildBk.keycloak.clientId ("enbuild").
    clientId: ""
  # Base path the SPA prefixes onto hub API calls. Empty → "/enbuild-bk/api/v1".
  apiBase: ""
  # Impact-level enclave this hub represents (e.g. "IL5"). Rendered as a header
  # badge so the pane self-identifies its enclave. Empty → null → no badge. Set
  # this per-enclave at deploy. A legibility tag, NOT the isolation boundary —
  # the hub-per-IL deployment IS (ADR-0044). vendor13-ib demo override: "IL5".
  impactLevel: ""
  image:
    tag: ""                       # [CUSTOMER] pin console image; empty = appVersion
    # [INTERNAL]
    repository: enbuild-staging/vivsoft-platform-ui/enbuild-frontend
    # registry: per-service air-gap override; unset → global.image.registry
  # [INTERNAL] internal ClusterIP service reached via mesh/ingress + in-pod nginx.
  service_type: ClusterIP
  node_port: 30080                # consumed only if service_type=NodePort (unsupported)

## @section ENBUILD Backend (gRPC API + control plane)
enbuildBk:
  replicas: 1                     # [CUSTOMER]
  # [CUSTOMER] backend CPU/memory.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  # --- [CUSTOMER] operator credential Secret references (never inline secrets) ---
  # Operator Secret (key ENCRYPTION_KEY) — at-rest data encryption key. REQUIRED.
  # Rotating it re-keys stored data; treat as a data migration.
  encryptionKey:
    existingSecret: ""
  # Operator Secret (key RABBIT_MQ_CONNECTION_STRING) — keeps broker password
  # out of values. REQUIRED unless using the bundled-broker dev path.
  messaging:
    existingSecret: ""
  # Operator Secret (key GITLAB_TOKEN) for catalog/GitOps; usually supplied via
  # installAgent.existingSecret instead.
  gitlabPat:
    existingSecret: ""
  # Operator Secret with Big Bang security-tool creds (Twistlock/Anchore/Falco). Optional.
  securityTooling:
    existingSecret: ""
  # Operator Secret (key SIEM_SIGNING_KEY) for /audit/export-bundle. Optional (prod-preferred).
  exportSigning:
    existingSecret: ""
    privateKeyPem: ""             # dev/test inline path only

  # --- [CUSTOMER] SSO / authentication (Keycloak) ---
  # P1 is Keycloak-only. authMechanism defaults to "keycloak"; the chart wires the
  # backend's JWT-verifier config from the keycloak block below. The chart FAILS the
  # render (backend-secret.yaml) if authMechanism=keycloak but no realm public key is
  # supplied here OR via keycloak.existingSecret — so a misconfigured install errors
  # loudly instead of silently booting in spoofable "local" mode / unverified tokens.
  # Set "local" ONLY for dev/test with no SSO.
  authMechanism: "keycloak"       # keycloak | local
  adminEmails: ""                 # break-glass platform admins (comma-sep). Durable admin = the /enbuild/platform-admins Keycloak group.
  keycloak:
    realm: "enbuild"              # [CUSTOMER] realm name
    url: ""                       # [CUSTOMER] browser-facing Keycloak base URL (KEYCLOAK_URL)
    backendUrl: ""                # [CUSTOMER] in-cluster Keycloak URL the backend calls (KEYCLOAK_BACKEND_URL)
    issuer: ""                    # [CUSTOMER] token issuer (KEYCLOAK_ISSUER); defaults to <url>/realms/<realm> if your IdP follows the standard
    clientId: "enbuild"           # confidential backend client id
    adminBaseUrl: ""              # admin REST base URL (KEYCLOAK_ADMIN_BASE_URL) for group/user management
    adminClientId: ""             # admin client id (KEYCLOAK_ADMIN_CLIENT_ID)
    # Realm RSA PUBLIC key (PEM body, no headers) used to VERIFY login tokens. Public, not secret,
    # but coupled to the realm signing key — do not rotate casually. Supply here OR via existingSecret.
    realmPublicKey: ""
    # Operator Secret carrying the SECRET auth keys. Recommended for production. Expected keys:
    #   KEYCLOAK_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET, and (optionally) KEYCLOAK_REALM_PUBLIC_KEY.
    existingSecret: ""
  # --- [CUSTOMER] Hub gRPC AgentGateway (how spoke agents reach this hub) ---
  grpcVirtualService:
    enabled: true
    host: ""                      # REQUIRED external gRPC FQDN agents dial (cert SAN)
    additionalHosts: []           # extra :authority names to route
    gateway: istio-gateway/public-ingressgateway   # <ns>/<gateway>
  # --- install-agent (how the hub installs the agent onto spoke clusters) ---
  reaperSvc:
    # [CUSTOMER] Operator Secret with REAPER_SVC_AWS_ACCESS_KEY_ID +
    # REAPER_SVC_AWS_SECRET_ACCESS_KEY for the teardown Reaper's cloud-release
    # gate + tag-then-delete ELB sweep. Without it, EVERY cluster destroy
    # orphans the Istio gateway ELB (gate times out, sweep is a no-op). The svc
    # identity needs AddTags + tag-conditioned elb:DeleteLoadBalancer. Same
    # operator-managed-secret idiom as installAgent. (CCM orphan-ELB fix.)
    existingSecret: ""
  installAgent:
    # [CUSTOMER] Operator Secret with GITLAB_TOKEN + ENBUILD_REPO1_USER +
    # ENBUILD_REPO1_TOKEN. REQUIRED for launches/agent installs (also supplies
    # the backend's GITLAB_TOKEN).
    existingSecret: ""
    hubUrl: ""                    # [CUSTOMER] host:443 the spoke agent dials back to (REQUIRED)
    tlsServerName: ""             # [CUSTOMER] hub cert SAN for TLS SNI on the NLB-DNS path
    hubInternalIps: ""            # [CUSTOMER] legacy CSV of NLB IPs (air-gap /etc/hosts)
    # [INTERNAL] agent image + chart source pins (fleet-moves-together, ADR-0034).
    agentImageTag: "ac99ae1830c427a65db31a6874e5d4414d90133f"
    chartRepo: "https://gitlab.com/enbuild-staging/iac-templates/platform-one-eks.git"
    # MUST track `main` — the maintained branch whose install-agent-core.sh lib and
    # enbuild-core/enbuild-stack charts are kept consistent together. The old
    # `feat/p1ccm-agent-chart-skeleton` branch was a migration-era pin that went
    # stale: its lib lacked iac_ensure_namespace + IAC_EXISTING_STACK and its
    # enbuild-core chart still templated the agent namespace (conflicting with the
    # lib that now creates it) — so EVERY UI import failed mid-Job. `main` carries
    # the current, co-designed lib+charts (no namespace conflict). See ADR-0049.
    chartRef: "main"
    # --- [CUSTOMER] Portability knobs (ADR-0049 follow-up) ---
    # All empty/registry1 by default → a stock P1/Iron Bank deploy is unchanged.
    # An AF P1 / non-enbuild-staging customer overrides these (or sets them at
    # runtime via admin-settings) so the import pulls the agent image + the spoke
    # private-registry pull-secret from THEIR registry, with no code fork.
    repo1Registry: ""             # spoke private-registry docker-server (empty → registry1.dso.mil)
    agentImageRegistry: ""        # registry host for the agent image (composed with agentImageRepository)
    agentImageRepository: ""      # agent image path; full path, or path-after-registry when agentImageRegistry set
    agentImagePullSecret: ""      # name of the imagePullSecret for the agent image (image.pullSecrets[0].name)
  image:
    tag: ""                       # [CUSTOMER] pin backend image; empty = appVersion
    # [INTERNAL]
    repository: enbuild-staging/vivsoft-platform-ui/enbuild-backend
    # registry: per-service air-gap override; unset → global.image.registry

  # --- [INTERNAL] (do not override) ---
  # Inline at-rest key EMPTY by design — provide via encryptionKey.existingSecret.
  encryption_key: ""
  # Optional non-secret GitLab SCM connection config (host/group/projectId/
  # namespaceId/ref). Unset = platform/per-catalog defaults (as live). The
  # GITLAB_TOKEN is NEVER set here — it rides installAgent.existingSecret.
  gitlabConnection: {}
  service_type: ClusterIP
  grpcEnabled: true
  grpcPort: 8443                  # fixed; matches hardcoded container/targetPort
  grpcServiceType: ClusterIP
  clusterRpcTimeoutMs: "10000"    # 2026-06-11 latency P0 — fail fast so one slow/dead agent RPC can't pin a console poll; the serial-dispatch bottleneck that motivated 30000 is gone
  snapshotIngestEnabled: "true"   # ADR-0035 fleet snapshot store (permanent)
  snapshotReadFromStore: "true"
  kubeProxyFallbackActor: ""      # console K8sApiProxy header-less fallback identity; empty = controller default (least-privilege, non-admin headlamp-proxy@platform.one.mil)
  # ADR-0046 console-auth cutover (audit finding F4). Default OFF — flip to true
  # ONLY in the coordinated cutover roll (together with Headlamp OIDC + Keycloak
  # exposed at a real URL + AUTH_MECHANISM=keycloak), else the console locks out.
  # When true: deny tokenless console/proxy requests; authorize ONLY from the
  # verified Keycloak token (no header/body/query fallback, ADMIN_EMAILS data-path
  # retired). See runbooks/console-auth-strict-cutover.md.
  consoleAuthStrict: false
  # ADR-0046 CA-10 spoke per-user impersonation. Default OFF. When true the proxy
  # forwards Impersonate-User/-Group (verb-matched) from the verified token so the
  # spoke RBAC + audit attribute to the real user. MUST pair with the agent chart
  # rbac.consoleImpersonation.enabled=true (the spoke half) — they flip together.
  spokeImpersonation: false
  healthProbe:
    enabled: true
  kubeProxyCache:
    schemaTtlSeconds: "300"
    listTtlSeconds: "10"
    maxEntries: "50"
  serviceAccount: ""              # empty binds the chart-minted installer SA

## @section ENBUILD User service
enbuildUser:
  replicas: 1                     # [CUSTOMER]
  image:
    tag: ""                       # [CUSTOMER] empty = appVersion
    repository: enbuild-staging/vivsoft-platform-ui/enbuild-user   # [INTERNAL]
  service_type: ClusterIP         # [INTERNAL]


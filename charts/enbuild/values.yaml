## @section ENBUILD Backend Services parameters
## @param enbuildBk.image.repository  Container repository for enbuildBk
## @param enbuildBk.image.tag  [nullable] Container image tag. Skip to use the HelmChart appVersion as Image Tag
## @param enbuildBk.replicas Container enbuildBk Replicas
## @param enbuildBk.service_type  enbuildBk service_type
## @param enbuildBk.encryption_key  encryption_key to be used by Backend
## @param enbuildBk.gitlabPat.existingSecret  Name of an operator-managed Secret carrying GITLAB_TOKEN (and optionally GITLAB_HOST). When set, the deployment adds an envFrom for that secret; the inline GITLAB_TOKEN from enbuildConsumer.gitlab.token is omitted to avoid duplicate envvars. Use this in P1 environments where the PAT is provisioned out-of-band and rotated separately. Backwards-compatible default: empty (uses inline values).
## @param enbuildBk.exportSigning.existingSecret  Name of an operator-managed Secret carrying SIEM_SIGNING_KEY (PEM-encoded ECDSA P-256 private key) for the CCM-32 audit export bundle (EN-1237). Strongly preferred over privateKeyPem for production. Backwards-compatible default: empty.
## @param enbuildBk.exportSigning.privateKeyPem  Inline PEM private key used to sign /audit/export-bundle responses. Dev/test only; production should use existingSecret. Multiline string. Backwards-compatible default: empty (signing disabled; bundle returns signed=false).
## @param enbuildBk.kubeProxyFallbackActor [nullable,string] Headlamp K8sApiProxy fallback actor email. When Headlamp requests carry no X-Actor-Email/JWT, the KubeProxyController falls back to this value. Empty = hardcoded controller default (`alice@example.com`).
## @param enbuildBk.clusterRpcTimeoutMs [default: "30000"] ClusterRpcService timeout (ms) for hub-to-agent RPCs. Raise from the 10000 source default to avoid "Lost connection to the cluster" under serial-dispatch agents with concurrent Headlamp requests.
## @param enbuildBk.healthProbe.enabled [default: true] Enable liveness/readiness probes on enbuild-bk. Set to false on environments where the Terminus RSS threshold causes a death loop from K8sApiProxy /openapi/v2 buffering.
## @param enbuildBk.healthProbe.livenessPath [default: "/api/health"] HTTP path for the bk liveness probe. Default is the combined endpoint on the standard released backend; P1-CCM overrides to /api/health/live (heap-only) to keep the RSS dimension out of the liveness check.
## @param enbuildBk.healthProbe.readinessPath [default: "/api/health"] HTTP path for the bk readiness probe. Default is the combined endpoint; P1-CCM overrides to /api/health/ready (heap + mongo + disk).
## @param enbuildBk.kubeProxyCache.schemaTtlSeconds [default: "300"] TTL (seconds) for the /openapi/v2 and API-discovery schema cache tier. Empty = source default 300 s.
## @param enbuildBk.kubeProxyCache.listTtlSeconds [default: "10"] TTL (seconds) for resource-list cache tier. Empty = source default 10 s.
## @param enbuildBk.kubeProxyCache.maxEntries [default: "50"] LRU entry cap per cache tier. Empty = source default 50.
enbuildBk:
  image:
    repository: enbuild-staging/vivsoft-platform-ui/enbuild-backend
  replicas: 1
  service_type: ClusterIP
  encryption_key: "encryption_key"
  ## P1 CCM Console — Headlamp K8sApiProxy fallback actor (BE 099 demo-mode
  ## hook, see backend/microservices/enbuild/src/kubeProxy/kubeProxy.controller.ts).
  ## When Headlamp's HTTP requests carry no X-Actor-Email/JWT, the
  ## KubeProxyController falls back to this value before applying tenancy
  ## (project membership). Set to an email that's a member of the project
  ## owning the demo cluster. Empty = hardcoded controller default
  ## (`alice@example.com`). Keeps `kubectl set env` patches from getting
  ## reverted on the next helm-upgrade / auto-reconcile.
  kubeProxyFallbackActor: ""
  ## P1 CCM Console — ClusterRpcService timeout for hub→agent RPCs (ms).
  ## Default in source (cluster-rpc.service.ts) is 10000 — too tight for
  ## Headlamp browsing through the K8sApiProxy: a serial-dispatch agent
  ## (agents/enbuild-agent/internal/stream/stream.go) processes Headlamp's
  ## ~10 parallel requests one-at-a-time; the tail of the queue exhausts
  ## the 10s budget before its handler even starts → "Lost connection to
  ## the cluster" red banner. 30000 (30s) makes this rare. The proper
  ## fix lives in the agent (concurrent Dispatch + serialized Send via
  ## outbound channel); this is the env-var quick-win that ships first.
  ## Default raised to 30000 (was "") on 2026-05-19 so every release ships
  ## with the keepalive-safe value — prior empty default meant new deploys
  ## inherited the 10s source default and re-hit the lost-connection bug.
  clusterRpcTimeoutMs: "30000"
  ## P1 CCM Console — bk health probe gate (2026-05-21). When false, the
  ## chart skips rendering livenessProbe + readinessProbe on enbuild-bk.
  ## Use case: bk's NestJS Terminus health check has a hardcoded
  ## memory_rss threshold (app.service.ts:30) that K8sApiProxy buffering of
  ## /openapi/v2 (11 MB per call on Big Bang spokes) can exceed in normal
  ## operation, causing a death loop that breaks every spoke agent gRPC
  ## stream. Default true keeps existing posture; flip to false on
  ## environments where the source threshold hasn't been raised yet.
  ## Probe HTTP paths. Default /api/health — the combined endpoint present on
  ## the standard released backend. P1-CCM exposes the dedicated split
  ## endpoints and should override these to /api/health/live (heap-only) and
  ## /api/health/ready (heap + mongo + disk) so the combined check's RSS
  ## dimension can't trip the death loop described above.
  healthProbe:
    enabled: true
    livenessPath: /api/health
    readinessPath: /api/health
  ## P1 CCM Console — KubeProxyCacheService tuning (BE 100, 2026-05-26).
  ## The hub BE caches K8sApiProxy GET responses to eliminate Headlamp's
  ## "Failed to get authentication information: Request timed-out" on
  ## Big Bang spokes. /openapi/v2 is ~11 MB and takes ~13 s through the
  ## spoke gRPC stream — past Headlamp's ~10 s client-side fetch
  ## timeout. First operator pays the cost; everyone else inside the
  ## TTL window gets <50 ms.
  ##
  ## Two TTL tiers, env-tunable. Empty values fall back to source
  ## defaults (300 / 10 / 50). Watch/exec/log/subresource/single-item
  ## GETs and all non-GET verbs bypass the cache entirely. Stream
  ## teardown invalidates the cluster's slice so reconnects never
  ## serve stale schema.
  kubeProxyCache:
    ## Schema tier — /openapi/v2 + v3 + API/group/version discovery.
    ## Content only changes when CRDs are added/removed; 5 min is
    ## conservative. Empty = source default 300 s.
    schemaTtlSeconds: "300"
    ## List tier — resource lists (namespaced + cluster-scoped). Short
    ## TTL matches Headlamp's auto-refresh cadence so dashboards still
    ## feel current. Empty = source default 10 s.
    listTtlSeconds: "10"
    ## LRU cap per tier. Memory ceiling at 50 entries × ~11 MB schema +
    ## 50 × ~1 MB list = ~600 MB worst case, well under the 1 GB RSS
    ## threshold. Empty = source default 50.
    maxEntries: "50"
  ## P1 CCM Console — operator-managed secret support (backwards-compatible).
  ## See template comments in backend-secret.yaml + enbuild-bk.yaml.
  gitlabPat:
    existingSecret: ""
  exportSigning:
    existingSecret: ""
    privateKeyPem: ""
  securityTooling:
    ## @param enbuildBk.securityTooling.existingSecret Name of an operator-managed Secret carrying hub-self CCM-13d security-tooling env (TWISTLOCK_API_URL/USERNAME/PASSWORD, ANCHORE_API_URL/USERNAME/PASSWORD, FALCO_CLUSTER_ID, FALCO_WEBHOOK_SECRET, OPA_GATEKEEPER_ENABLED, FALCO_AUDIT_LANE). Added as an envFrom on the bk container. Keeps Big Bang tool creds out of Helm values + rotatable out-of-band; bridges them cross-namespace into the bk pod. Backwards-compatible default: empty (hub-self reports those sources unavailable until set).
    existingSecret: ""
  ## CCM-08b install-agent endpoint configuration (ADR-0029 — chart-managed,
  ## first-install-correct, survives every `helm upgrade --reuse-values`).
  ##
  ## Sensitive bits (GITLAB_TOKEN / ENBUILD_REPO1_USER / ENBUILD_REPO1_TOKEN)
  ## ride an operator-pre-created Secret; non-secret config rides helm values.
  ## Before this section existed, operators kubectl-set-env'd these post-install
  ## and they were wiped by the next chart roll. Mirrors the operator-managed-
  ## secret idiom from gitlabPat/exportSigning/securityTooling above.
  installAgent:
    ## @param enbuildBk.installAgent.existingSecret Name of an operator-managed Secret carrying the 3 sensitive install-agent env vars: GITLAB_TOKEN (gitlab.com PAT for cloning the agent chart repo), ENBUILD_REPO1_USER (registry1.dso.mil pull username), ENBUILD_REPO1_TOKEN (registry1.dso.mil pull token). When set, the deployment adds an envFrom for that secret. When empty (default), the install-agent endpoint 503s on use with a clear error AND NOTES.txt prints a warning at install time. Operator pre-creates via `kubectl -n enbuild create secret generic enbuild-install-agent-creds --from-literal=GITLAB_TOKEN=... --from-literal=ENBUILD_REPO1_USER=... --from-literal=ENBUILD_REPO1_TOKEN=...`. Rotation = kubectl recreate Secret + rollout restart BE.
    existingSecret: ""
    ## @param enbuildBk.installAgent.hubUrl Hub gRPC endpoint (host:port) the spoke agent dials outbound. Default is the legacy vendor13-ib NLB DNS; override per environment via examples/enbuild/values-<env>.yaml.
    hubUrl: "enbuild-ib-vendor13.staging.dso.mil:443"
    ## @param enbuildBk.installAgent.tlsServerName HA-path TLS SAN/SNI override (optional). Set to the hub cert SAN when HUB_URL points at an AWS NLB DNS name (Route53 round-robins per-AZ IPs); spokes dial the DNS + use this for verification. Leave empty for the legacy hostAliases path.
    tlsServerName: ""
    ## @param enbuildBk.installAgent.hubInternalIps Legacy CSV of per-AZ NLB IPs for spoke /etc/hosts hostAliases (air-gapped clusters that can't use AWS DNS). Empty by default; the HA path (tlsServerName + DNS) supersedes it.
    hubInternalIps: ""
    ## @param enbuildBk.installAgent.agentImageTag SHA of the enbuild-agent container image install-agent helm-installs on the spoke. Bump per agent release. Defaults baked in here so a fresh helm install gets a known-good tag without operator action; override via --set on rolls.
    agentImageTag: "ac99ae1830c427a65db31a6874e5d4414d90133f"
    ## @param enbuildBk.installAgent.chartRepo Git URL of the chart repo install-agent's Job clones to obtain enbuild-core / enbuild-stack / enbuild-agent charts. Default = platform-one-eks; override for forks or alt mirrors.
    chartRepo: "https://gitlab.com/enbuild-staging/iac-templates/platform-one-eks.git"
    ## @param enbuildBk.installAgent.chartRef Branch/tag of the chart repo install-agent's Job clones. Default tracks the long-lived integration branch where chart edits land before merge to main.
    chartRef: "feat/p1ccm-agent-chart-skeleton"
  ## @param enbuildBk.serviceAccount Override the BE pod's ServiceAccount. When empty (default), the pod binds to `{{ .Release.Name }}-enbuild-bk-installer` (minted by enbuild-bk-rbac.yaml; carries the perms install-agent needs). Override only if a deployment mode needs a different SA.
  serviceAccount: ""

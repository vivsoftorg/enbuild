  image:
    registry: ""                  # [CUSTOMER] per-service air-gap override; unset → global
    tag: ""                       # [CUSTOMER] empty = appVersion
    repository: enbuild-staging/vivsoft-platform-ui/enbuild-mq-consumer   # [INTERNAL]
  # [INTERNAL]

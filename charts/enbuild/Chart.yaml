apiVersion: v2
name: enbuild
description: A Helm chart for ENBUILD
type: application
keywords: [enbuild, bigbang]
home: https://www.vivsoft.io/
sources: [https://github.com/vivsoftorg/enbuild]
icon: https://enbuild-docs.vivplatform.io/images/emma/enbuild-logo.png
kubeVersion: '>=1.25.0-0'
version: 0.1.0-p1ccm-trunk.7
appVersion: 1.0.30
maintainers:
  - name: Juned Memon
    email: jmemon@vivsoft.io
# Opinionated ENBUILD hub platform. Only two subcharts ship with the platform:
#   - rabbitmq : the launch/event message broker (core; always on).
#   - headlamp : the embedded cluster console (operations; toggle via
#                lightning_features.operations_lightning.headlamp).
# The previously-bundled jupyterhub / open-webui / loki-stack dependencies were
# removed in 0.1.0 — they were gated OFF in every environment and added a large
# unsupported upstream value surface + attack surface. See
# docs/VALUES-OPINIONATION-AUDIT.md.
dependencies:
  - name: rabbitmq
    version: 11.13.0
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  - name: headlamp
    version: 0.36.0
    repository: https://kubernetes-sigs.github.io/headlamp/
    condition: lightning_features.operations_lightning.headlamp
